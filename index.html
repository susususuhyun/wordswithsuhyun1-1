<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>워드마스터 고등베이직 1~8강 (완전판)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* 아코디언 애니메이션 최적화 */
        .accordion-content { 
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out, opacity 0.3s ease-in-out; 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
        }
        .accordion-content.open { 
            max-height: 500px; 
            opacity: 1; 
            padding-top: 1rem; 
            padding-bottom: 1rem; 
        }

        .flip-container { perspective: 1000px; width: 100%; height: 60vh; max-height: 400px; }
        .flipper {
            width: 100%; height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .front, .back {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* iOS Safari 필수 */
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .back {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }
        .flip-container.flipped .flipper {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }

        /* 사이드바 애니메이션 */
        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }
        .menu-item.active { background-color: #1e293b; color: #38bdf8; border-right: 4px solid #38bdf8; font-weight: 700; }
    </style>
</head>
<body class="flex h-screen w-full relative text-slate-800">

    <!-- 모바일 사이드바 오버레이 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- 사이드바 -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900 border-r border-slate-700 z-50 flex flex-col h-full shadow-2xl md:shadow-none flex-shrink-0 text-slate-300">
        <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950">
            <h1 class="text-lg font-black text-white tracking-tight"><i class="fa-solid fa-graduation-cap text-sky-400 mr-2"></i>고등 베이직</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto py-2" id="menuContainer">
            <!-- JS 메뉴 렌더링 -->
        </div>
    </aside>

    <!-- 메인 컨텐츠 -->
    <main class="flex-1 flex flex-col h-full relative min-w-0 bg-slate-50">
        
        <!-- 헤더 -->
        <header class="bg-sky-600 text-white p-4 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="md:hidden mr-4 text-white hover:text-sky-200 transition">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>
                <div>
                    <h2 id="currentLessonTitle" class="text-lg font-bold">1강</h2>
                    <p id="wordCountLabel" class="text-xs text-sky-100 mt-0.5">총 40단어</p>
                </div>
            </div>
            <button onclick="toggleMode()" id="modeToggleBtn" class="bg-sky-800 bg-opacity-40 text-white px-4 py-1.5 rounded-full text-sm font-bold shadow-sm hover:bg-sky-700 transition border border-sky-400">
                <i class="fa-solid fa-clone mr-1"></i> 카드모드
            </button>
        </header>

        <div id="listView" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 pb-24">
            <!-- JS 리스트 렌더링 -->
        </div>

        <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900 z-30 flex-col pb-8 pt-16">
            <div class="flex justify-between items-center px-6 pb-4 text-white">
                <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 text-sky-400 shadow-inner">0 / 0</span>
                <button onclick="toggleMode()" class="text-slate-400 hover:text-white transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>

            <!-- 완벽 수정된 3D 플래시카드 뼈대 -->
            <div class="flex-1 flex items-center justify-center p-6 w-full">
                <div class="flip-container" id="flipContainer" onclick="flipCard()">
                    <div class="flipper">
                        <!-- 앞면 -->
                        <div class="front bg-white flex flex-col justify-center items-center p-8 text-center border-b-8 border-sky-500">
                            <span id="cardBadge" class="absolute top-6 text-xs font-bold text-sky-600 bg-sky-50 px-3 py-1 rounded-full border border-sky-200">1강</span>
                            <h2 id="cardWord" class="text-4xl md:text-5xl font-black text-slate-800 mb-4 tracking-tight break-words">Word</h2>
                            <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-hand-pointer mr-2"></i>탭하여 뒤집기</p>
                        </div>

                        <!-- 뒷면 -->
                        <div class="back bg-slate-800 flex flex-col p-6 md:p-8 text-white overflow-y-auto border border-slate-600">
                            <h2 id="cardWordBack" class="text-2xl font-bold mb-2 border-b border-slate-600 pb-2 text-sky-400">Word</h2>
                            <p id="cardMeaning" class="text-xl md:text-2xl font-black mb-5 text-white">의미</p>
                            
                            <div class="bg-slate-900 rounded-xl p-4 md:p-5 shadow-inner mb-4 border border-slate-700">
                                <p class="text-[0.75rem] text-sky-400 mb-1.5 font-bold uppercase tracking-wider"><i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원 스토리</p>
                                <p id="cardRoot" class="text-[0.9rem] leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                            </div>

                            <div class="bg-slate-900 rounded-xl p-4 md:p-5 shadow-inner border border-slate-700 mt-auto">
                                <p class="text-[0.75rem] text-emerald-400 mb-1.5 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어</p>
                                <p id="cardCognates" class="text-[0.85rem] font-medium text-slate-400">동계어</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-center items-center space-x-8 px-6 pb-6">
                <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-800 text-slate-300 flex justify-center items-center active:bg-slate-700 hover:bg-slate-700 transition border border-slate-600 shadow-lg hover:text-sky-400">
                    <i class="fa-solid fa-chevron-left text-2xl"></i>
                </button>
                <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-sky-600 text-white flex justify-center items-center active:bg-sky-700 hover:bg-sky-500 transition shadow-[0_0_20px_rgba(2,132,199,0.4)] font-bold">
                    <i class="fa-solid fa-chevron-right text-2xl"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const db = {
            "1강": [
                { w: "quantity", m: "양, 수량", r: "quantus(얼마나 많은) + ity → 눈으로 셀 수 있거나 측정할 수 있는 덩어리", c: "quantify(양을 재다), quality(질)" },
                { w: "aim", m: "목표, 목적, 목표로 하다, 겨냥하다", r: "aesmer(평가하다) → 화살을 쏘기 전에 거리를 재고 똑바로 맞추려는 행동", c: "estimate(평가하다)" },
                { w: "reject", m: "거절하다, 거부하다", r: "re(뒤로) + ject(던지다) → 상대가 준 것을 안 받겠다고 다시 뒤로 휙 던져버림", c: "project(계획하다), inject(주사하다)" },
                { w: "experience", m: "경험하다, 경험", r: "ex(밖으로) + per(시도하다) + ence → 몸을 밖으로 던져 직접 부딪혀보며 얻은 것", c: "experiment(실험), expert(전문가)" },
                { w: "practical", m: "실용적인, 실제적인", r: "pract(행동하다) + ical → 머릿속 이론이 아니라 진짜 손발을 움직여 써먹을 수 있는 성질", c: "practice(연습, 실행)" },
                { w: "include", m: "포함하다", r: "in(안에) + clud(닫다) → 테두리 안으로 밀어 넣고 문을 꼭 닫아 내 것으로 만듦", c: "exclude(제외하다), conclude(결론짓다)" },
                { w: "carry out", m: "~을 실행[수행]하다, ~을 완료하다", r: "carry(나르다) + out(밖으로) → 마음속에 있던 계획을 바깥 현실 세계로 날라(가져와) 완성하다", c: "-" },
                { w: "grief", m: "(깊은) 슬픔, 비탄", r: "gravis(무거운) → 가슴 위에 무거운 돌덩이가 얹혀 있는 것처럼 숨막히고 아픈 감정", c: "grave(무덤, 심각한), gravity(중력)" },
                { w: "supply", m: "공급하다, 제공하다, 공급", r: "sup(아래서부터) + ply(채우다) → 모자란 밑바닥부터 위까지 꽉꽉 채워주다", c: "complete(완전한), plenty(풍부함)" },
                { w: "improve", m: "개선하다, 향상하다", r: "in(안으로) + prove(이익) → 상태를 지금보다 더 이익이 되거나 가치 있는 쪽으로 끌어올림", c: "profit(이익)" },
                { w: "failure", m: "실패, 실패작, 고장", r: "fail(실패하다) + ure → 목표에 닿지 못하고 도중에 픽 쓰러져버린 상태", c: "fail(실패하다)" },
                { w: "provide", m: "공급하다, 제공하다, 대비하다", r: "pro(앞을) + vid(보다) → 앞날에 무슨 일이 생길지 미리 내다보고 필요한 걸 준비해 두다", c: "video(비디오), vision(시야)" },
                { w: "emerge", m: "나타나다, 모습을 드러내다, 드러나다", r: "e(밖으로) + merg(잠기다/뜨다) → 물속 깊이 잠겨 안 보이던 것이 수면 밖으로 쑥 떠오르다", c: "emergency(비상사태), merge(합병하다)" },
                { w: "share", m: "나누다, 공유하다, 몫", r: "고대 영어 scearu(자르다) → 하나의 큰 파이를 여러 조각으로 예쁘게 잘라서 각자 나눠 갖는 것", c: "shear(털을 깎다)" },
                { w: "increase", m: "증가하다, 증가시키다, 증가, 인상", r: "in(안에) + creas(자라다) → 씨앗이 땅 안에서 쑥쑥 자라나 부피가 점점 커짐", c: "create(창조하다), decrease(감소하다)" },
                { w: "run into", m: "~와 우연히 만나다, ~와 충돌하다", r: "run(달리다) + into(~안으로) → 정신없이 달리다가 코너에서 예상치 못한 사람이나 상황 안으로 쾅 부딪힘", c: "-" },
                { w: "inferior", m: "열등한, 하위의, 손아랫사람, 하급자", r: "infer(아래의) + ior → 남들보다 등수나 가치가 더 밑바닥에 깔려 있는", c: "inferno(지옥), superior(우수한)" },
                { w: "emotion", m: "감정, 정서", r: "e(밖으로) + mot(움직이다) + ion → 마음속 깊이 눌러둔 느낌이 얼굴이나 행동을 통해 밖으로 터져 나옴", c: "motion(움직임), motivate(동기를 주다)" },
                { w: "recover", m: "회복하다, 복구되다", r: "re(다시) + cover(덮다/얻다) → 잃어버렸던 건강이나 재산을 다시 덮어 내 것으로 가져오다", c: "cover(덮다), discover(발견하다)" },
                { w: "refuse", m: "거절하다, 거부하다", r: "re(뒤로) + fus(붓다) → 상대가 주는 제안을 안 받겠다고 내 등 뒤로 확 쏟아버리다", c: "confuse(혼란시키다), fuse(녹이다)" },
                { w: "moment", m: "순간, 중요성", r: "movimentum(움직임) → 저울추가 까닥 하고 아주 짧게 한 번 움직이는 그 찰나의 시간", c: "move(움직이다), momentum(탄력)" },
                { w: "common", m: "흔한, 보통의, 공통의", r: "com(함께) + mun(의무, 나누다) → 특별한 권력자만 갖는 게 아니라 누구나 널리 함께 나눠 갖는", c: "community(공동체), immune(면역의)" },
                { w: "success", m: "성공, 성공작", r: "sub(아래서부터) + cess(가다) → 가장 밑바닥에서 시작해 포기하지 않고 원하는 정상까지 도달하다", c: "proceed(진행하다), access(접근)" },
                { w: "certain", m: "확실한, 확신하는, 어떤", r: "cert(결정된) + ain → 의심할 여지 없이 도장이 쾅 찍혀 딱 정해진 상태", c: "certificate(증명서)" },
                { w: "advanced", m: "진보한, 상급의", r: "ad(~로) + vant(앞으로) + ed → 남들보다 한 발 더 앞쪽으로 쑥 나아가서 실력이 뛰어난", c: "advance(전진하다), advantage(유리함)" },
                { w: "slight", m: "약간의, 하찮은", r: "고대 영어 sliht(평평한, 매끄러운) → 너무 얇고 매끄러워서 무게감이나 중요성이 거의 없는 수준", c: "slice(얇게 썰다)" },
                { w: "consider", m: "고려[숙고]하다, ~으로 여기다", r: "con(함께) + sider(별) → 고대에 중대한 결정을 내릴 때 밤하늘의 별자리를 함께 보며 뚫어지게 점치던 행동", c: "desire(바라다 - 별에게 소원을 빌다)" },
                { w: "belief", m: "믿음, 신념, 신앙", r: "be(강조) + lief(사랑하다) → 그것이 보이지 않더라도 진짜라고 내 마음 깊이 맹세하고 굳게 사랑하는 마음", c: "believe(믿다)" },
                { w: "express", m: "표현하다, 나타내다, 속달로 보내다, 급행의, 신속한, 급행, 속달", r: "ex(밖으로) + press(누르다) → 머릿속 생각을 밖으로 꾹 짜내어 보여주다 (또는 쫙 짜내듯 빨리 가다)", c: "press(누르다), pressure(압력)" },
                { w: "accept", m: "받아들이다, 수락하다", r: "ad(~쪽으로) + cept(잡다) → 누군가 주는 것을 거부하지 않고 내 쪽으로 기꺼이 끌어당겨 손에 쥐다", c: "except(제외하다), capture(포획하다)" },
                { w: "decrease", m: "감소하다, 감소시키다, 감소, 축소", r: "de(아래로) + creas(자라다) → 위로 커지지 않고 반대로 아래로 점점 쪼그라들다", c: "increase(증가하다), create(창조하다)" },
                { w: "situation", m: "상황, 위치", r: "situ(장소) + ation → 사람이나 사물이 특정한 시간과 물리적인 장소에 놓여 있는 모습(꼴)", c: "site(현장), situate(위치시키다)" },
                { w: "superior", m: "뛰어난, 우월한, 상급의, 윗사람, 상급자", r: "super(위로) + ior → 질이나 위치가 평범한 것들보다 한참 더 위쪽에 솟아있는", c: "supreme(최고의), surface(표면)" },
                { w: "similar", m: "비슷한, 유사한", r: "simil(같은) + ar → 완전히 100% 똑같지는 않지만, 언뜻 보면 거의 같은 성질을 띠는", c: "assimilate(동화되다), simulate(모방하다)" },
                { w: "indifferent", m: "무관심한", r: "in(아닌) + different(다른) → 이것을 주든 저것을 주든 '다르지 않다(상관없다)'며 신경을 끄는 태도", c: "different(다른), differ(다르다)" },
                { w: "fade", m: "희미해지다, 사라지다", r: "vado(가다, 사라지다) → 선명했던 색깔이나 소리가 점점 멀리 가버려서 옅어지는 현상", c: "evade(피하다), invade(침략하다)" },
                { w: "disappear", m: "사라지다, 없어지다", r: "dis(반대) + appear(나타나다) → 나타나 있던 모습의 반대가 되어 시야에서 지워져 버리다", c: "appear(나타나다)" },
                { w: "produce", m: "생산하다, 만들어 내다, 초래하다, 농산물", r: "pro(앞으로) + duc(이끌다) → 공장이나 밭에서 물건을 밖(앞)으로 쑥쑥 이끌어내어 형태를 만듦", c: "reduce(줄이다), educate(교육하다)" },
                { w: "depend on[upon]", m: "~에 의존[의지]하다, ~에 달려 있다", r: "de(아래로) + pend(매달리다) + on → 스스로 서지 못하고 누군가의 등 밑에 대롱대롱 매달려 있는 모습", c: "suspend(매달다), pendulum(진자)" },
                { w: "seek", m: "찾다, 추구하다, 청하다", r: "고대 영어 sagian(쫓다, 찾다) → 사냥개가 진실이나 사냥감을 향해 집요하게 냄새를 맡고 뒤쫓다", c: "sake(이익, 목적)" }

        function initApp() {
            renderMenu();
            loadLesson("1강");
        }

        function renderMenu() {
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = '';
            
            Object.keys(db).forEach(lessonName => {
                const btn = document.createElement('button');
                btn.className = `menu-item w-full text-left px-5 py-3 text-sm transition-colors duration-200 hover:bg-slate-800 ${currentLesson === lessonName ? 'active' : ''}`;
                btn.innerHTML = `<i class="fa-solid fa-book-open mr-3 ${currentLesson === lessonName ? 'text-sky-400' : 'text-slate-500'}"></i>${lessonName}`;
                btn.onclick = () => {
                    loadLesson(lessonName);
                    if (window.innerWidth <= 768) toggleSidebar();
                };
                menuContainer.appendChild(btn);
            });
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }

        function loadLesson(lessonName) {
            currentLesson = lessonName;
            document.getElementById('currentLessonTitle').innerText = lessonName;
            currentCardIndex = 0;
            currentFlatWordList = db[lessonName] || [];
            document.getElementById('wordCountLabel').innerText = `총 ${currentFlatWordList.length}단어`;
            
            renderMenu();
            renderList();
        }

                        <div id="content-${id}" class="accordion-content bg-slate-50 px-4 border-t border-slate-100">
                            <div class="mb-4 pt-2">
                                <span class="inline-block bg-sky-100 text-sky-800 text-xs px-2 py-1 rounded font-bold mb-2 border border-sky-200">
                                    <i class="fa-solid fa-seedling mr-1"></i>어원스토리
                                </span>
                                <p class="text-[0.9rem] text-slate-700 leading-relaxed font-medium break-keep">${item.r}</p>
                            </div>
                            <div class="pb-3">
                                <span class="inline-block bg-slate-200 text-slate-600 text-xs px-2 py-1 rounded font-bold mb-2">
                                    <i class="fa-solid fa-link mr-1"></i>패밀리 단어
                                </span>
                                <p class="text-[0.85rem] text-slate-600 font-semibold">${item.c}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            htmlContent += `</div>`;
            listView.innerHTML = htmlContent;
            updateFlashcard();
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        function toggleMode() {
            const flashcardView = document.getElementById('flashcardView');
            const modeBtn = document.getElementById('modeToggleBtn');
            const listView = document.getElementById('listView');
            
            if (flashcardView.classList.contains('hidden')) {
                flashcardView.classList.remove('hidden');
                flashcardView.classList.add('flex');
                listView.classList.add('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
                
                // 모드 전환 시 항상 카드가 앞면부터 보이도록 강제 리셋
                resetCardFlip(); 
                setTimeout(updateFlashcard, 50); // 리셋 애니메이션 이후 데이터 갱신
            } else {
                flashcardView.classList.add('hidden');
                flashcardView.classList.remove('flex');
                listView.classList.remove('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
            }
        }

        function updateFlashcard() {
            if(currentFlatWordList.length === 0) return;
            const item = currentFlatWordList[currentCardIndex];

            document.getElementById('cardBadge').innerText = currentLesson;
            document.getElementById('cardWord').innerText = item.w;
            document.getElementById('cardWordBack').innerText = item.w;
            document.getElementById('cardMeaning').innerText = item.m;
            document.getElementById('cardRoot').innerText = item.r;
            document.getElementById('cardCognates').innerText = item.c;
            
            document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatWordList.length}`;
        }

        function flipCard() {
            const container = document.getElementById('flipContainer');
            isFlipped = !isFlipped;
            if (isFlipped) {
                container.classList.add('flipped');
            } else {
                container.classList.remove('flipped');
            }
        }

        function resetCardFlip() {
            isFlipped = false;
            document.getElementById('flipContainer').classList.remove('flipped');
        }

        function prevCard() {
            resetCardFlip();
            setTimeout(() => {
                currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : currentFlatWordList.length - 1;
                updateFlashcard();
            }, 150); // 카드 뒷면 내용이 바뀌는 걸 숨기기 위해 약간의 지연
        }

        function nextCard() {
            resetCardFlip();
            setTimeout(() => {
                currentCardIndex = (currentCardIndex < currentFlatWordList.length - 1) ? currentCardIndex + 1 : 0;
                updateFlashcard();
            }, 150);
        }

        // 앱 부팅
        window.onload = initApp;
    </script>
</body>
</html>
