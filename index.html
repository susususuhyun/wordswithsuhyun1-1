<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>예술과 무대의 어원 단어장 - 16 plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #1c1917; overflow-x: hidden; color: #f5f5f4; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.35s ease-in-out, padding 0.35s ease-in-out, opacity 0.35s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 3D 플래시카드 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 모바일 최적화 컨테이너 */
        .app-container { max-width: 480px; margin: 0 auto; background-color: #292524; min-height: 100vh; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .highlight-rose { color: #f43f5e; font-weight: 700; }
    </style>
</head>
<body>

<div class="app-container flex flex-col h-screen overflow-hidden">
    
    <header class="bg-rose-900 text-stone-100 p-5 sticky top-0 z-20 flex justify-between items-center shadow-lg border-b border-rose-800">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight"><i class="fa-solid fa-masks-theater text-rose-400 mr-2"></i>메타인지 단어장</h1>
            <p class="text-xs text-rose-200 mt-1">중등 고난도 16 plus - <span class="text-white font-bold">예술·공연·문학</span></p>
        </div>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-rose-50 text-rose-900 px-4 py-2 rounded-full text-sm font-bold shadow-md hover:bg-white transition">
            <i class="fa-solid fa-clone mr-1"></i> 카드모드
        </button>
    </header>

    <main id="listView" class="flex-1 overflow-y-auto p-4 space-y-5 pb-24 bg-stone-900">
        <!-- JavaScript로 리스트 콘텐츠 삽입 -->
    </main>

    <div id="flashcardView" class="hidden absolute inset-0 bg-stone-900/95 z-30 flex-col pb-10 backdrop-blur-sm">
        <!-- 헤더 컨트롤 -->
        <div class="flex justify-between items-center p-5 text-white">
            <span id="flashcardCounter" class="text-sm font-bold bg-stone-800 px-4 py-1.5 rounded-full border border-stone-700 text-rose-400 shadow-inner">1 / 35</span>
            <button onclick="toggleMode()" class="text-stone-400 hover:text-rose-400 transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
        </div>

        <!-- 3D 카드 본체 -->
        <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
            <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                
                <!-- 카드 앞면 (영어 단어) -->
                <div class="absolute inset-0 w-full h-full bg-stone-800 rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.6)] backface-hidden flex flex-col justify-center items-center p-8 text-center border border-stone-700">
                    <span id="cardGroup" class="absolute top-6 text-[0.7rem] font-bold text-rose-900 bg-rose-400 px-3 py-1 rounded-md tracking-wider">그룹</span>
                    <h2 id="cardWord" class="text-4xl font-black text-stone-100 mb-4 tracking-tight break-words">Word</h2>
                    <p class="text-stone-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-rotate mr-2"></i>카드를 뒤집어 해설 확인</p>
                </div>

                <!-- 카드 뒷면 (의미, 어원, 동계어) -->
                <div class="absolute inset-0 w-full h-full bg-rose-950 rounded-3xl shadow-[0_15px_40px_rgba(225,29,72,0.15)] backface-hidden rotate-y-180 flex flex-col p-6 text-stone-200 overflow-y-auto border border-rose-900">
                    <h2 id="cardWordBack" class="text-2xl font-bold mb-2 border-b border-rose-800 pb-2 text-rose-300">Word</h2>
                    <p id="cardMeaning" class="text-xl font-black mb-5 text-white">의미</p>
                    
                    <div class="bg-black/30 rounded-xl p-4 mb-4 shadow-inner border border-rose-900/50">
                        <p class="text-[0.75rem] text-rose-400 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-lightbulb mr-1"></i> 메타인지 어원 스토리</p>
                        <p id="cardRoot" class="text-[0.9rem] leading-relaxed text-stone-300 font-medium break-keep">어원 설명</p>
                    </div>
                    
                    <div class="bg-black/30 rounded-xl p-4 shadow-inner border border-rose-900/50">
                        <p class="text-[0.75rem] text-stone-400 mb-2 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어 (Cognates)</p>
                        <p id="cardCognates" class="text-sm font-medium text-stone-400">동계어 설명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 버튼 -->
        <div class="flex justify-center items-center space-x-8 px-6 pb-4">
            <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-stone-800 text-stone-300 flex justify-center items-center active:bg-stone-700 hover:bg-stone-700 transition shadow-lg border border-stone-600 hover:text-rose-400">
                <i class="fa-solid fa-chevron-left text-2xl"></i>
            </button>
            <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-rose-600 text-white flex justify-center items-center active:bg-rose-500 hover:bg-rose-500 transition shadow-[0_0_20px_rgba(225,29,72,0.4)] font-bold">
                <i class="fa-solid fa-chevron-right text-2xl"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const wordData = [
        // 그룹 1: 음악과 무대 공연
        { word: "rehearsal", meaning: "예행연습", root: "re(다시) + hearse(가래질하다) + al(명사) → 거칠고 울퉁불퉁한 밭을 가래로 거듭 파서 고르게 만들듯, 진짜 무대에 오르기 전 반복해서 다듬고 준비하는 과정입니다.", cognates: "hearse(영구차 - 원래는 가래나 써레 같은 농기구를 뜻했음)", group: "1. 음악과 무대 공연" },
        { word: "comedy", meaning: "희극", root: "komos(즐거운 연회) + ode(노래) → 고대 그리스에서 포도주를 마시며 열던 신나는 잔치(komos)에서 부르던 노래에서 유래하여, 사람들에게 웃음을 주는 '희극'이 되었습니다.", cognates: "melody(가락), ode(송시)", group: "1. 음악과 무대 공연" },
        { word: "tragic", meaning: "비극의, 비극적인", root: "tragos(염소) + ode(노래) → 고대 그리스 경연대회에서 제물로 바칠 염소를 두고 부른 슬픈 노래, 혹은 염소 가죽을 쓴 배우들이 부른 노래에서 유래한 단어입니다.", cognates: "tragedy(비극)", group: "1. 음악과 무대 공연" },
        { word: "melody", meaning: "곡조, 가락", root: "melos(노래) + ode(부르다) → 여러 음들이 모여 사람들이 따라 부르기 좋게 이어지는 아름다운 소리의 흐름입니다.", cognates: "comedy(희극), tragedy(비극)", group: "1. 음악과 무대 공연" },
        { word: "sound", meaning: "음색, 음조", root: "라틴어 sonus(소리) → 무대나 악기에서 발생하는 청각적인 파동이나 특정한 울림(음색)을 의미합니다.", cognates: "sonic(소리의), sonar(음파 탐지기)", group: "1. 음악과 무대 공연" },
        { word: "in chorus", meaning: "합창으로, 이구동성으로", root: "chorus(춤추는 무리, 합창단) → 고대 연극에서 무리를 지어 함께 노래하고 춤추던 사람들처럼, '여럿이 한목소리로'라는 뜻입니다.", cognates: "choir(성가대), choreograph(안무를 짜다)", group: "1. 음악과 무대 공연" },
        
        // 그룹 2: 창작과 작곡
        { word: "create", meaning: "창조하다", root: "라틴어 creare(만들다, 낳다) → 무(無)에서 유(有)를 끌어내어 세상에 없던 새로운 예술 작품이나 개념을 탄생시키는 행위입니다.", cognates: "creative(창조적인), creature(생명체)", group: "2. 예술적 창작과 구성" },
        { word: "composition", meaning: "작곡", root: "com(함께) + posit(놓다) + ion → 악보 위에 흩어진 여러 음표와 박자들을 조화롭게 어우러지도록 '함께 모아 놓는' 치밀한 작업입니다.", cognates: "compose(구성하다, 작곡하다), deposit(예금하다)", group: "2. 예술적 창작과 구성" },
        { word: "composer", meaning: "작곡가", root: "com(함께) + pos(놓다) + er(사람) → 음계, 리듬, 화성을 함께(com) 잘 배치하여(pos) 하나의 곡을 완성해 내는 사람입니다.", cognates: "component(구성 요소), position(위치)", group: "2. 예술적 창작과 구성" },
        { word: "make up", meaning: "구성하다", root: "make(만들다) + up(완전히) → 여러 흩어진 조각이나 요소들을 끌어모아 빈틈없이 '완전히 하나로 만들어내는' 과정을 뜻하는 구동사입니다.", cognates: "makeup(화장, 구성)", group: "2. 예술적 창작과 구성" },
        { word: "sculptor", meaning: "조각가", root: "sculp(새기다, 파내다) + tor(사람) → 단단한 돌이나 나무의 불필요한 부분을 끌로 깎아내고 새겨서(sculp) 형상을 만들어내는 예술가입니다.", cognates: "sculpture(조각품)", group: "2. 예술적 창작과 구성" },
        { word: "craftsman", meaning: "장인, 숙련공", root: "craft(손재주, 기술) + s + man(사람) → 오랜 시간 갈고닦은 고도의 손기술(craft)을 가진 전문가를 뜻합니다.", cognates: "craft(공예, 기술), spacecraft(우주선)", group: "2. 예술적 창작과 구성" },
        
        // 그룹 3: 문학과 문맥
        { word: "literary", meaning: "문학의", root: "litera(글자) + ary(형용사) → 알파벳이나 '글자(litera)'를 활용하여 사상과 감정을 표현하는 예술 분야와 관련된 단어입니다.", cognates: "literature(문학), literal(글자 그대로의)", group: "3. 문학과 텍스트" },
        { word: "subject", meaning: "주제, 테마", root: "sub(아래에) + ject(던지다) → 작가가 글을 쓰거나 예술가가 작품을 만들 때, 바탕이 되도록 그 '아래에 던져놓은' 핵심 사상입니다.", cognates: "object(물체), project(계획)", group: "3. 문학과 텍스트" },
        { word: "out of context", meaning: "문맥을 무시하고", root: "out of(~밖으로) + con(함께) + text(짜다) → 실을 '함께 짜서' 만든 천(문맥)의 자연스러운 결에서 강제로 벗어나게 하여, 전체적인 흐름을 무시한다는 뜻입니다.", cognates: "context(문맥), textile(직물)", group: "3. 문학과 텍스트" },
        { word: "contextual", meaning: "문맥의", root: "con(함께) + text(짜다) + ual(형용사) → 단어나 문장이 덩그러니 놓인 것이 아니라, 주변의 상황과 '함께 직물처럼 짜여 있는' 흐름을 뜻합니다.", cognates: "text(글, 본문)", group: "3. 문학과 텍스트" },
        { word: "hold [own] a copyright", meaning: "저작권을 소유하다", root: "copy(복사) + right(권리) → 내가 창작한 문학이나 예술 작품을 타인이 함부로 쓰지 못하게 하고, 오직 나만 합법적으로 '복제할 권리(right)'를 갖는 것입니다.", cognates: "right(올바른, 권리)", group: "3. 문학과 텍스트" },
        
        // 그룹 4: 전시와 감상
        { word: "exhibition", meaning: "전시, 전람", root: "ex(밖으로) + hibit(가지다, 보여주다) + ion → 작업실 안에 숨겨두었던 작품을 대중들이 볼 수 있도록 '밖으로(ex) 꺼내어 보여주는' 행사입니다.", cognates: "exhibit(전시하다), inhibit(억제하다 - 안에 두다)", group: "4. 전시 및 감상" },
        { word: "on exhibit", meaning: "전시되어", root: "on(~상태에) + ex(밖으로) + hibit(두다) → 작품이 수장고에서 나와 대중을 향해 밖으로(ex) 전시가 진행 중인 상태를 나타냅니다.", cognates: "prohibit(금지하다)", group: "4. 전시 및 감상" },
        { word: "display", meaning: "전시하다, 전시회를 열다", root: "dis(반대, 풀다) + plicare(접다) → 겹겹이 '접혀 있던(plicare)' 것을 사람들이 잘 보도록 활짝 '펼쳐(dis) 보여주는' 행위입니다.", cognates: "play(놀다), deploy(전개하다, 배치하다)", group: "4. 전시 및 감상" },
        { word: "appreciation", meaning: "감상, 평가; 감사", root: "ad(~에게) + preci(가치, 가격) + ation → 예술 작품을 보며 그것이 품은 진정한 '가치(price)'를 알아보고 평가하는 일이며, 타인의 호의에 가치를 매기면 '감사'가 됩니다.", cognates: "price(가격), precious(귀중한)", group: "4. 전시 및 감상" },
        { word: "exclamation", meaning: "외침, 감탄", root: "ex(밖으로) + clam(소리치다) + ation → 멋진 공연이나 작품을 보고 마음속에 끓어오르는 놀라움을 참지 못하고 '밖으로 소리쳐' 내뱉는 감탄입니다.", cognates: "claim(주장하다), proclaim(선언하다)", group: "4. 전시 및 감상" },
        { word: "imitation", meaning: "모방, 모조", root: "imitat(흉내내다) + ion → 훌륭한 원본 예술품이나 타인의 창작물을 마치 사진을 찍듯 똑같이 흉내 내어 따라 만드는 작업입니다.", cognates: "imitate(모방하다), image(이미지)", group: "4. 전시 및 감상" },
        { word: "copy", meaning: "모조하다, 모사하다", root: "라틴어 copia(풍부함) → 하나밖에 없는 원본 작품을 여러 개로 베껴서 수량을 '풍부하게' 늘린다는 데서 유래했습니다.", cognates: "copious(방대한, 풍부한)", group: "4. 전시 및 감상" },
        
        // 그룹 5: 감독과 지휘
        { word: "direct", meaning: "연출하다", root: "di(멀리) + rect(똑바른) → 배우나 연주자들이 딴길로 새지 않도록, 작품이 의도한 '똑바른(rect) 방향'으로 안내하고 통제하는 일입니다.", cognates: "direction(방향), correct(올바른)", group: "5. 감독과 지휘" },
        { word: "directorial", meaning: "감독의", root: "direct(이끌다) + or(사람) + ial(형용사) → 무대나 현장을 똑바른 방향으로 이끄는 최고 권위자의 역할이나 성격을 띠는 단어입니다.", cognates: "director(감독, 연출자)", group: "5. 감독과 지휘" },
        { word: "conductor", meaning: "지휘자", root: "con(함께) + duc(이끌다) + tor(사람) → 수십 명의 오케스트라 단원들이 각기 다른 소리를 낼 때, 그들을 '함께(con) 이끌어(duc)' 하나의 하모니를 만드는 사람입니다.", cognates: "conduct(행동하다, 지휘하다), educate(교육하다)", group: "5. 감독과 지휘" },
        { word: "leader", meaning: "감독, 연출자, 지도자", root: "lead(이끌다) + er(사람) → 예술 단체나 공연 팀의 맨 앞에서 그들이 가야 할 예술적 방향을 제시하고 끌고 가는 사람입니다.", cognates: "lead(이끌다), leadership(지도력)", group: "5. 감독과 지휘" },
        
        // 그룹 6: 구별과 계급
        { word: "nobility", meaning: "고귀함; 귀족", root: "nobilis(잘 알려진, 훌륭한) + ity → 평범한 사람들과 달리 그 명성이 널리 알려져 있고, 사회적으로 훌륭한 계급에 속하는 상태입니다.", cognates: "noble(고귀한), note(주목하다)", group: "6. 구별과 계급의 차이" },
        { word: "ignoble", meaning: "천한", root: "ig(부정, 아닌) + noble(귀족의, 고귀한) → 행동이나 신분이 고귀하지(noble) 못하여 비열하거나 천박하다는 뜻의 단어입니다.", cognates: "ignore(무시하다)", group: "6. 구별과 계급의 차이" },
        { word: "be distinct from", meaning: "~와는 다르다", root: "dis(따로) + stinct(찌르다) → 여럿이 섞여 있는 것 중에서, 바늘로 콕 찔러내어 '따로 분리해 둘' 만큼 그 특징이 뚜렷하게 다름을 의미합니다.", cognates: "distinguish(구별하다), instinct(본능)", group: "6. 구별과 계급의 차이" },
        { word: "different", meaning: "다른, 별개의", root: "dis(떨어져) + fer(나르다) + ent → 같은 곳에서 출발했더라도 서로 '다른 방향으로 날라져서' 결과적으로 같지 않게 된 상태입니다.", cognates: "differ(다르다), ferry(여객선 - 나르는 배)", group: "6. 구별과 계급의 차이" },
        { word: "individual", meaning: "다른, 별개의", root: "in(부정) + divid(나누다) + ual → 하나의 덩어리에서 '더 이상 쪼개질 수 없을' 정도로 완전히 따로 떨어져 나온 독립적이고 개별적인 상태입니다.", cognates: "divide(나누다), indivisible(나눌 수 없는)", group: "6. 구별과 계급의 차이" },
        { word: "traditional", meaning: "전통적인", root: "trans(건너서) + dit(주다) + ional → 과거의 세대에서 시간의 강을 '건너서(trans)' 현재의 세대에게로 쭈욱 '물려주는(dit)' 관습이나 예술 양식을 뜻합니다.", cognates: "tradition(전통), trade(무역)", group: "6. 구별과 계급의 차이" },
        { word: "stand in line", meaning: "줄을 서다", root: "line(실, 선) → 사람들이 무질서하게 모여 있는 것이 아니라, 마치 팽팽한 '실이나 선(line)' 모양처럼 차례대로 늘어선 모습입니다.", cognates: "linear(선의), outline(윤곽)", group: "6. 구별과 계급의 차이" }
    ];

    let currentCardIndex = 0;
    let isFlipped = false;
    let globalWordIndex = 0; // 아코디언 고유 ID용 카운터

    function renderList() {
        const listView = document.getElementById('listView');
        let htmlContent = '';
        globalWordIndex = 0; // 렌더링 시 인덱스 초기화
        
        // 데이터를 그룹별로 묶어줌
        const groupedData = wordData.reduce((acc, word) => {
            if (!acc[word.group]) acc[word.group] = [];
            acc[word.group].push(word);
            return acc;
        }, {});

        for (const [groupName, groupWords] of Object.entries(groupedData)) {
            // 그룹명에 깔끔하게 번호 제거 (플래시카드용)
            const cleanGroupName = groupName.replace(/^\d+\.\s*/, '');
            
            htmlContent += `
                <div class="mb-8">
                    <h2 class="text-[0.95rem] font-bold text-rose-400 uppercase tracking-widest mb-4 px-2 border-l-4 border-rose-500 pl-3 flex items-center">
                        <i class="fa-solid fa-masks-theater text-xs mr-2 opacity-80"></i> ${cleanGroupName}
                    </h2>
                    <div class="space-y-3">
            `;
            
            groupWords.forEach((item) => {
                const id = `word-${globalWordIndex++}`;
                
                htmlContent += `
                    <div class="bg-stone-800 rounded-xl shadow-lg border border-stone-700 overflow-hidden transform transition hover:-translate-y-0.5 hover:border-rose-900">
                        <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-stone-700/50 transition" onclick="toggleAccordion('${id}')">
                            <div class="pl-1">
                                <h3 class="text-lg font-bold text-stone-100">${item.word}</h3>
                                <p class="text-[0.9rem] text-stone-400 mt-1 font-medium">${item.meaning}</p>
                            </div>
                            <div class="text-rose-500 w-9 h-9 flex items-center justify-center bg-stone-900 rounded-full shadow-inner border border-stone-700 mr-1">
                                <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-xs"></i>
                            </div>
                        </div>
                        
                        <div id="content-${id}" class="accordion-content bg-black/20 px-5 border-t border-stone-700/50">
                            <div class="mb-4 pt-2">
                                <span class="inline-block bg-rose-900/40 text-rose-400 text-[0.7rem] px-2 py-1 rounded-md font-bold mb-2 border border-rose-800/50">
                                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>어원의 원리
                                </span>
                                <p class="text-[0.9rem] text-stone-300 leading-relaxed font-medium break-keep">${item.root}</p>
                            </div>
                            <div class="pb-3">
                                <span class="inline-block bg-stone-700/60 text-stone-300 text-[0.7rem] px-2 py-1 rounded-md font-bold mb-1 border border-stone-600">
                                    <i class="fa-solid fa-link mr-1"></i>패밀리 단어
                                </span>
                                <p class="text-[0.85rem] text-stone-500 font-semibold">${item.cognates}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div></div>`;
        }
        listView.innerHTML = htmlContent;
        updateFlashcard();
    }

    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            icon.classList.remove('rotate-180');
        } else {
            content.classList.add('open');
            icon.classList.add('rotate-180');
        }
    }

    function toggleMode() {
        const flashcardView = document.getElementById('flashcardView');
        const modeBtn = document.getElementById('modeToggleBtn');
        
        if (flashcardView.classList.contains('hidden')) {
            flashcardView.classList.remove('hidden');
            flashcardView.classList.add('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
            updateFlashcard();
        } else {
            flashcardView.classList.add('hidden');
            flashcardView.classList.remove('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
        }
    }

    function updateFlashcard() {
        const item = wordData[currentCardIndex];
        const cleanGroupName = item.group.replace(/^\d+\.\s*/, '');
        
        document.getElementById('cardGroup').innerText = cleanGroupName;
        document.getElementById('cardWord').innerText = item.word;
        document.getElementById('cardWordBack').innerText = item.word;
        document.getElementById('cardMeaning').innerText = item.meaning;
        document.getElementById('cardRoot').innerText = item.root;
        document.getElementById('cardCognates').innerText = item.cognates;
        
        document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${wordData.length}`;
        
        if(isFlipped) {
            document.getElementById('flashcard').classList.remove('rotate-y-180');
            isFlipped = false;
        }
    }

    function flipCard() {
        const card = document.getElementById('flashcard');
        isFlipped = !isFlipped;
        if (isFlipped) {
            card.classList.add('rotate-y-180');
        } else {
            card.classList.remove('rotate-y-180');
        }
    }

    function prevCard() {
        currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : wordData.length - 1;
        updateFlashcard();
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex < wordData.length - 1) ? currentCardIndex + 1 : 0;
        updateFlashcard();
    }

    window.onload = () => {
        renderList();
    };
</script>
</body>
</html>
