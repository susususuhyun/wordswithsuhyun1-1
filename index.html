<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고등 베이직 통합 어원 단어장 (1~8강)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 10px; }

        /* 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.35s ease-in-out, padding 0.35s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 플래시카드 3D 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 모바일 사이드바 트랜지션 */
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }

        /* 활성화된 사이드바 메뉴 스타일 */
        .menu-item.active { background-color: #e0e7ff; color: #4338ca; border-right: 4px solid #4338ca; font-weight: 700; }
    </style>
</head>
<body class="flex h-screen w-full relative text-slate-800">

    <!-- 모바일 사이드바 오버레이 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- 왼쪽 사이드바 (메뉴) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-50 flex flex-col h-full shadow-2xl md:shadow-none flex-shrink-0">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h1 class="text-lg font-black text-slate-800 tracking-tight"><i class="fa-solid fa-graduation-cap text-indigo-600 mr-2"></i>고등 베이직</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-800"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4" id="menuContainer">
            <!-- JS 렌더링 영역 -->
        </div>
    </aside>

    <!-- 오른쪽 메인 콘텐츠 영역 -->
    <main class="flex-1 flex flex-col h-full relative min-w-0">
        
        <header class="bg-indigo-900 text-white p-4 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center">
                <button onclick="toggleSidebar()" class="md:hidden mr-4 text-white hover:text-indigo-200 transition">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div>
                    <h2 id="currentLessonTitle" class="text-lg font-bold">학습할 단원을 선택하세요</h2>
                    <p id="currentBookTitle" class="text-xs text-indigo-300 mt-0.5">왼쪽 메뉴를 열어주세요</p>
                </div>
            </div>
            <button onclick="toggleFlashcardMode()" id="modeToggleBtn" class="bg-indigo-700 bg-opacity-50 text-white px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm hover:bg-indigo-600 transition hidden border border-indigo-500">
                <i class="fa-solid fa-clone mr-1"></i> 카드모드
            </button>
        </header>

        <!-- 리스트 뷰 영역 -->
        <div id="listView" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 space-y-4 pb-24">
            <div class="flex flex-col items-center justify-center h-full text-slate-400">
                <i class="fa-solid fa-book-open text-6xl mb-4 text-slate-200"></i>
                <p class="font-medium text-lg">사이드바에서 단원을 선택해주세요.</p>
            </div>
        </div>

        <!-- 플래시카드 뷰 영역 -->
        <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900 z-30 flex-col pb-10 pt-16">
            <div class="flex justify-between items-center px-6 pb-4 text-white">
                <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 text-indigo-300 shadow-inner">0 / 0</span>
                <button onclick="toggleFlashcardMode()" class="text-slate-400 hover:text-white transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>

            <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
                <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                    
                    <!-- 앞면 -->
                    <div class="absolute inset-0 w-full h-full bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] backface-hidden flex flex-col justify-center items-center p-8 text-center border-b-8 border-indigo-500">
                        <span id="cardGroup" class="absolute top-6 text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">그룹</span>
                        <h2 id="cardWord" class="text-4xl font-black text-slate-800 mb-4 tracking-tight break-words">Word</h2>
                        <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-hand-pointer mr-2"></i>탭하여 뜻/어원 확인</p>
                    </div>

                    <!-- 뒷면 -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-2xl backface-hidden rotate-y-180 flex flex-col p-6 text-white overflow-y-auto border border-slate-700">
                        <h2 id="cardWordBack" class="text-2xl font-bold mb-3 border-b border-slate-600 pb-2 text-indigo-300">Word</h2>
                        <p id="cardMeaning" class="text-xl font-black mb-4 text-white">의미</p>
                        
                        <div class="bg-slate-900 bg-opacity-80 rounded-xl p-4 shadow-inner mb-3 border border-slate-700">
                            <p class="text-[0.7rem] text-indigo-400 mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원 스토리</p>
                            <p id="cardRoot" class="text-[0.85rem] leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                        </div>

                        <div class="bg-slate-900 bg-opacity-80 rounded-xl p-4 shadow-inner border border-slate-700">
                            <p class="text-[0.7rem] text-teal-400 mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어 (Cognates)</p>
                            <p id="cardCognates" class="text-[0.85rem] font-medium text-slate-400">동계어</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-center items-center space-x-8 px-6 pb-4">
                <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-700 text-white flex justify-center items-center active:bg-slate-600 hover:bg-slate-600 transition border border-slate-600 shadow-lg">
                    <i class="fa-solid fa-chevron-left text-2xl"></i>
                </button>
                <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-indigo-600 text-white flex justify-center items-center active:bg-indigo-500 hover:bg-indigo-500 transition shadow-[0_0_20px_rgba(79,70,229,0.4)] font-bold border border-indigo-400">
                    <i class="fa-solid fa-chevron-right text-2xl"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        const database = {
            "고등 베이직": {
                // ========================== [ 1강 ] ==========================
                "1강 (목표와 성취)": [
                    // 그룹 1: 목표와 성취
                    { word: "aim", meaning: "목표, 목적, 목표로 하다, 겨냥하다", root: "고대 프랑스어 aesmer(평가하다, 겨냥하다)에서 유래. 화살을 쏘기 전에 목표물의 거리를 '계산하고 겨냥하는' 동작에서 비롯됨.", cognates: "estimate(평가하다)", group: "1. 목표와 성취" },
                    { word: "achieve", meaning: "이루다, 성취하다", root: "ad(~에) + caput(머리, 끝) → 일의 '끝(머리)'에 도달하여 마침내 완성해내다.", cognates: "chief(우두머리), capital(수도)", group: "1. 목표와 성취" },
                    { word: "success", meaning: "성공, 성공작", root: "sub(아래로) + cedere(가다) → 뒤를 이어가다. 처음에는 '계승'을 뜻했으나, 나중에 목적을 이루어 그 '결과에 다다름'으로 뜻이 발전함.", cognates: "succeed(성공하다, 뒤를 잇다)", group: "1. 목표와 성취" },
                    { word: "failure", meaning: "실패, 실패작, 고장", root: "fallere(속이다, 실망시키다) → 기대에 미치지 못하고 실망을 주어 어긋나다.", cognates: "fail(실패하다), false(거짓의)", group: "1. 목표와 성취" },
                    { word: "complete", meaning: "완료하다, 완전한", root: "com(완전히) + plere(채우다) → 빈 곳 없이 꽉 채워서 모든 과정을 마친 상태.", cognates: "plenty(풍부함), supply(공급하다)", group: "1. 목표와 성취" },
                    { word: "improve", meaning: "개선하다, 향상하다", root: "in(안으로) + prou(이익) → 어떤 것을 더 좋게 만들어서 가치나 이익을 더하다.", cognates: "profit(이익)", group: "1. 목표와 성취" },

                    // 그룹 2: 소유와 분배
                    { word: "quantity", meaning: "양, 수량", root: "quantus(얼마나 많은) → 크기, 무게, 숫자 등 측정할 수 있는 물건의 분량.", cognates: "quantify(양을 재다)", group: "2. 소유와 분배" },
                    { word: "share", meaning: "나누다, 공유하다, 몫", root: "고대 영어 scearu(자르다) → 큰 것을 잘라서 각자의 '몫'으로 나누어 가지다.", cognates: "shear(털을 깎다)", group: "2. 소유와 분배" },
                    { word: "provide", meaning: "공급하다, 제공하다, 대비하다", root: "pro(앞을) + videre(보다) → 다가올 미래를 미리 내다보고 필요한 것을 준비해서 주다.", cognates: "video(비디오), vision(시력)", group: "2. 소유와 분배" },
                    { word: "supply", meaning: "공급하다, 제공하다, 공급", root: "sub(아래에서) + plere(채우다) → 모자란 부분을 밑에서부터 위로 꽉 채워주다.", cognates: "complete(완전한)", group: "2. 소유와 분배" },
                    { word: "increase", meaning: "증가하다, 증가시키다, 증가, 인상", root: "in(안에) + crescere(자라다) → 크기나 숫자, 가치 등이 점점 자라나서 커지다.", cognates: "create(창조하다), crescent(초승달)", group: "2. 소유와 분배" },

                    // 그룹 3: 상호작용과 감정
                    { word: "reject", meaning: "거절하다, 거부하다", root: "re(뒤로) + jacere(던지다) → 상대방이 내민 제안이나 물건을 받지 않고 뒤로 휙 던져버리다.", cognates: "project(계획), object(물건, 반대하다)", group: "3. 상호작용과 감정" },
                    { word: "refuse", meaning: "거절하다, 거부하다", root: "re(뒤로) + fundere(붓다) → 남이 준 것을 받아들이지 않고 다시 뒤로 쏟아버리다.", cognates: "confuse(혼란시키다)", group: "3. 상호작용과 감정" },
                    { word: "emotion", meaning: "감정, 정서", root: "e(밖으로) + movere(움직이다) → 마음속에 있던 느낌이 밖으로 움직여 나타난 것.", cognates: "motion(움직임), move(움직이다)", group: "3. 상호작용과 감정" },
                    { word: "grief", meaning: "(깊은) 슬픔, 비탄", root: "gravis(무거운) → 마음을 짓누르는 아주 무겁고 고통스러운 감정.", cognates: "gravity(중력), grave(무덤, 심각한)", group: "3. 상호작용과 감정" },
                    { word: "recover", meaning: "회복하다, 복구되다", root: "re(다시) + capere(잡다, 얻다) → 잃어버렸던 건강이나 상태를 다시 붙잡다.", cognates: "capture(포획하다)", group: "3. 상호작용과 감정" },

                    // 그룹 4: 관점과 논리
                    { word: "practical", meaning: "실용적인, 실제적인", root: "prattein(행하다) + cal → 머릿속 이론이 아니라 실제로 행동하고 쓸 수 있는.", cognates: "practice(연습, 실행)", group: "4. 관점과 논리" },
                    { word: "inferior", meaning: "열등한, 하위의, 하급자", root: "infra(아래의) + ior(비교급) → 질이나 지위가 남보다 더 아래에 있는.", cognates: "infrastructure(기반 시설)", group: "4. 관점과 논리" },
                    { word: "certain", meaning: "확실한, 확신하는, 어떤", root: "cernere(결정하다, 체로 치다) → 불확실한 것을 걸러내고 확실하게 결정된 것.", cognates: "certify(증명하다)", group: "4. 관점과 논리" },
                    { word: "common", meaning: "흔한, 보통의, 공통의", root: "com(함께) + munus(의무, 선물) → 사람들이 함께 나누어 가져서 어디에나 있는.", cognates: "community(공동체)", group: "4. 관점과 논리" },
                    { word: "include", meaning: "포함하다", root: "in(안에) + claudere(닫다) → 테두리 안에 넣고 문을 닫아 자기 것으로 만들다.", cognates: "close(닫다), exclude(제외하다)", group: "4. 관점과 논리" },
                    { word: "emerge", meaning: "나타나다, 모습을 드러내다", root: "e(밖으로) + mergere(물에 잠기다) → 물속에 잠겨 있던 것이 밖으로 떠오르다.", cognates: "merge(합병하다), emergency(비상사태)", group: "4. 관점과 논리" },

                    // 그룹 5: 동사와 표현
                    { word: "experience", meaning: "경험하다, 경험", root: "ex(밖으로) + periri(시도하다) → 위험을 무릅쓰고 밖에서 직접 시도해 보며 얻은 것.", cognates: "expert(전문가), experiment(실험)", group: "5. 동사와 표현" },
                    { word: "carry out", meaning: "~을 실행[수행]하다, ~을 완료하다", root: "carry(나르다) + out(밖으로, 끝까지) → 계획을 끝까지 밀고 나아가 완수하다.", cognates: "carry(나르다)", group: "5. 동사와 표현" },
                    { word: "run into", meaning: "~와 우연히 만나다, ~와 충돌하다", root: "run(달리다) + into(~안으로) → 뛰어가다 보니 예상치 못한 사람이나 상황 속으로 부딪히다.", cognates: "run(달리다)", group: "5. 동사와 표현" },
                    { word: "moment", meaning: "순간, 중요성", root: "movere(움직이다) → 시간이 움직이는 아주 짧고 찰나적인 때. 물리에서의 '모멘트(영향력)'에서 '중요성'이라는 뜻도 생김.", cognates: "movement(움직임)", group: "5. 동사와 표현" }
                ],
                // ========================== [ 2강 ] ==========================
                "2강 (인식과 관계)": [
                    // 그룹 1: 인식과 처리
                    { word: "recognize", meaning: "인식[인지]하다, 인정하다", root: "re(다시) + cognoscere(알다) → 예전에 보거나 들었던 것을 다시 보고 '아하!' 하고 알아채다.", cognates: "cognitive(인지의), ignore(무시하다)", group: "1. 인식과 처리" },
                    { word: "process", meaning: "과정, 처리, 처리하다, 가공하다", root: "pro(앞으로) + cedere(가다) → 일이나 일이 순서대로 앞으로 나아가는 일련의 단계.", cognates: "proceed(진행하다), success(성공)", group: "1. 인식과 처리" },
                    { word: "consider", meaning: "고려[숙고]하다, ~으로 여기다", root: "con(함께) + sidus(별) → 옛날 점성술사들이 별자리를 함께 모아보며 운명을 깊이 고민하던 것에서 유래.", cognates: "desire(열망하다 - 별에게 바라다)", group: "1. 인식과 처리" },
                    { word: "seek", meaning: "찾다, 추구하다, 청하다", root: "고대 영어 secan (추적하다) → 원하는 목표나 물건을 얻기 위해 애써 뒤쫓다.", cognates: "beseech(간청하다)", group: "1. 인식과 처리" },
                    { word: "express", meaning: "표현하다, 나타내다, 신속한, 급행", root: "ex(밖으로) + pressare(누르다) → 마음속 생각을 꾹 눌러 밖으로 짜내다. (짜내서 바로 쏘니까 '급행'이라는 뜻도 됨)", cognates: "press(누르다), pressure(압력)", group: "1. 인식과 처리" },
                    { word: "conceal", meaning: "숨기다, 비밀로 하다", root: "con(완전히) + celare(숨기다) → 남들이 보지 못하게 덮어서 철저히 감추다.", cognates: "cell(세포, 작은 방 - 숨겨진 공간)", group: "1. 인식과 처리" },
                    { word: "reveal", meaning: "드러내다, 폭로하다", root: "re(뒤로, 반대) + velare(베일을 덮다) → 덮어둔 베일을 벗겨서 숨겨진 것을 보여주다.", cognates: "veil(베일), envelope(봉투)", group: "1. 인식과 처리" },
                    { word: "expose", meaning: "노출시키다, 폭로하다", root: "ex(밖으로) + ponere(놓다) → 보호받던 것을 밖으로 꺼내어 위험이나 사람들의 눈에 띄게 두다.", cognates: "position(위치), oppose(반대하다)", group: "1. 인식과 처리" },

                    // 그룹 2: 관계와 연결

        function renderMenu() {
            const menuContainer = document.getElementById('menuContainer');
            let menuHTML = '';

            for (const book in database) {
                for (const lesson in database[book]) {
                    const safeId = `menu-${book.replace(/\s+/g, '')}-${lesson.replace(/[^a-zA-Z0-9가-힣]/g, '')}`;
                    menuHTML += `
                        <button id="${safeId}" onclick="loadLesson('${book}', '${lesson}', '${safeId}')" 
                            class="menu-item w-full text-left px-6 py-3 text-sm text-slate-600 font-medium hover:bg-slate-100 transition flex items-center group">

                            ${lesson}
                        </button>
                    `;
                }
            }
            menuContainer.innerHTML = menuHTML;
        }

        function loadLesson(book, lesson, menuId) {
            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.remove('active');
                el.querySelector('div').classList.replace('bg-indigo-600', 'bg-slate-300');
            });
            
            const activeMenu = document.getElementById(menuId);
            activeMenu.classList.add('active');
            activeMenu.querySelector('div').classList.replace('bg-slate-300', 'bg-indigo-600');

            document.getElementById('currentLessonTitle').innerText = lesson;
            document.getElementById('currentBookTitle').innerText = book;
            document.getElementById('modeToggleBtn').classList.remove('hidden');

            currentFlatList = database[book][lesson];
            currentCardIndex = 0; 
            globalWordIndex = 0;  

            if(window.innerWidth < 768) {
                toggleSidebar();
            }
            renderList();
        }

                htmlContent += `
                    <div class="mb-6 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-indigo-50 border-b border-indigo-100 py-2.5 px-4 flex items-center">
                            <i class="fa-solid fa-layer-group text-indigo-500 mr-2 text-sm"></i>
                            <h2 class="text-sm font-bold text-indigo-800">${groupName}</h2>
                        </div>
                        <div class="divide-y divide-slate-100">
                `;
                
                groupWords.forEach((item) => {
                    const id = `word-item-${globalWordIndex++}`;
                    htmlContent += `
                        <div>
                            <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition" onclick="toggleAccordion('${id}')">
                                <div class="pr-4">
                                    <h3 class="text-lg font-extrabold text-slate-800">${item.word}</h3>
                                    <p class="text-[0.9rem] font-medium text-slate-500 mt-0.5 break-keep">${item.meaning}</p>
                                </div>
                                <div class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 flex-shrink-0">
                                    <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-sm"></i>
                                </div>
                            </div>
                            
                            <div id="content-${id}" class="accordion-content bg-slate-50 px-5 border-t border-slate-100">
                                <div class="mb-3 mt-1">
                                    <span class="inline-block bg-indigo-100 text-indigo-800 text-[10px] px-2 py-1 rounded-md font-bold mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원 스토리</span>
                                    <p class="text-[0.85rem] text-slate-700 leading-relaxed font-medium break-keep">${item.root}</p>
                                </div>
                                <div>
                                    <span class="inline-block bg-teal-100 text-teal-800 text-[10px] px-2 py-1 rounded-md font-bold mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어 (Cognates)</span>
                                    <p class="text-[0.85rem] text-slate-500 font-medium break-keep">${item.cognates}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                htmlContent += `</div></div>`;
            }
            listView.innerHTML = htmlContent;
            updateFlashcard();
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('open');
                overlay.classList.remove('hidden');
            }
        }

        function toggleFlashcardMode() {
            if(currentFlatList.length === 0) return;
            
            const flashcardView = document.getElementById('flashcardView');
            const modeBtn = document.getElementById('modeToggleBtn');
            const listView = document.getElementById('listView');
            
            if (flashcardView.classList.contains('hidden')) {
                flashcardView.classList.remove('hidden');
                flashcardView.classList.add('flex');
                listView.classList.add('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
                updateFlashcard();
            } else {
                flashcardView.classList.add('hidden');
                flashcardView.classList.remove('flex');
                listView.classList.remove('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
            }
        }

        function updateFlashcard() {
            if(currentFlatList.length === 0) return;
            const item = currentFlatList[currentCardIndex];
            
            document.getElementById('cardGroup').innerText = item.group;
            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardWordBack').innerText = item.word;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardRoot').innerText = item.root;
            document.getElementById('cardCognates').innerText = item.cognates;
            
            document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatList.length}`;
            
            if(isFlipped) {
                document.getElementById('flashcard').classList.remove('rotate-y-180');
                isFlipped = false;
            }
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            card.classList.toggle('rotate-y-180');
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : currentFlatList.length - 1;
            updateFlashcard();
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex < currentFlatList.length - 1) ? currentCardIndex + 1 : 0;
            updateFlashcard();
        }

        window.onload = () => {
            renderMenu();
            // 첫 번째 메뉴 자동 실행 (선택사항)
            loadLesson("고등 베이직", "1강 (목표와 성취)", "menu-고등베이직-1강목표와성취");
        };
    </script>
</body>
</html>
