<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>메타인지 어원 단어장 (12~14강)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 기본 폰트 및 앱 스타일 스크롤바 숨김 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 부드러운 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 300px; opacity: 1; padding-top: 1rem; padding-bottom: 0.5rem; }
        
        /* 카드 뒤집기 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 탭 액티브 상태 스타일 */
        .tab-btn.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 700; background-color: #e0e7ff; }

        /* 모바일 앱 컨테이너 제어 */
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="app-container flex flex-col h-screen overflow-hidden">
    
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 sticky top-0 z-20 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-brain mr-2"></i>메타인지 단어장</h1>
            <p class="text-xs text-indigo-200 mt-1">단원별 어원 학습 (12강 ~ 14강)</p>
        </div>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-white text-indigo-600 px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm hover:bg-indigo-50 transition">
            <i class="fa-solid fa-clone mr-1"></i> 카드모드
        </button>
    </header>

    <!-- 탭 내비게이션 (12, 13, 14강 분리) -->
    <div class="flex bg-white shadow-sm sticky top-[72px] z-10 border-b border-gray-200">
        <button id="tab-12" onclick="setLesson(12)" class="tab-btn active flex-1 py-3 text-sm text-gray-500 border-b-2 border-transparent transition duration-200">12강 (48단어)</button>
        <button id="tab-13" onclick="setLesson(13)" class="tab-btn flex-1 py-3 text-sm text-gray-500 border-b-2 border-transparent transition duration-200">13강 (50단어)</button>
        <button id="tab-14" onclick="setLesson(14)" class="tab-btn flex-1 py-3 text-sm text-gray-500 border-b-2 border-transparent transition duration-200">14강 (34단어)</button>
    </div>

    <!-- Main Content Area (List Mode) -->
    <main id="listView" class="flex-1 overflow-y-auto p-4 space-y-6 pb-24">
        <!-- 콘텐츠는 JavaScript로 렌더링됩니다 -->
    </main>

    <!-- Flashcard Mode (Hidden by default) -->
    <div id="flashcardView" class="hidden absolute inset-0 bg-gray-900 bg-opacity-95 z-30 flex-col pb-10">
        <!-- 헤더 -->
        <div class="flex justify-between items-center p-4 text-white">
            <span id="flashcardCounter" class="text-sm font-medium bg-gray-800 px-3 py-1 rounded-full border border-gray-700">1 / 48</span>
            <button onclick="toggleMode()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>

        <!-- 카드 영역 -->
        <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
            <div id="flashcard" class="w-full h-[70vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                
                <!-- 앞면 (단어) -->
                <div class="absolute inset-0 w-full h-full bg-white rounded-3xl shadow-2xl backface-hidden flex flex-col justify-center items-center p-8 text-center border-4 border-indigo-50">
                    <span id="cardGroup" class="absolute top-6 text-xs font-bold text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full">그룹</span>
                    <h2 id="cardWord" class="text-4xl font-bold text-gray-800 mb-2 break-all">Word</h2>
                    <p class="text-gray-400 text-sm mt-4 animate-pulse"><i class="fa-solid fa-hand-pointer mr-1"></i> 탭하여 뜻/어원 보기</p>
                </div>

                <!-- 뒷면 (뜻, 어원, 동계어) -->
                <div class="absolute inset-0 w-full h-full bg-indigo-600 rounded-3xl shadow-2xl backface-hidden rotate-y-180 flex flex-col p-8 text-white overflow-y-auto">
                    <h2 id="cardWordBack" class="text-2xl font-bold mb-4 border-b border-indigo-400 pb-2">Word</h2>
                    <p id="cardMeaning" class="text-xl font-semibold mb-6">의미</p>
                    
                    <div class="bg-indigo-700 bg-opacity-50 rounded-xl p-4 mb-4">
                        <p class="text-xs text-indigo-200 mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-seedling mr-1"></i> 어원 (Root)</p>
                        <p id="cardRoot" class="text-sm leading-relaxed">어원 설명</p>
                    </div>
                    
                    <div class="bg-indigo-700 bg-opacity-50 rounded-xl p-4">
                        <p class="text-xs text-indigo-200 mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 동계어 (Cognates)</p>
                        <p id="cardCognates" class="text-sm font-medium">동계어 설명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 네비게이션 컨트롤 -->
        <div class="flex justify-center items-center space-x-6 px-6">
            <button onclick="prevCard()" class="w-14 h-14 rounded-full bg-gray-800 text-white flex justify-center items-center active:bg-gray-700 hover:bg-gray-700 transition border border-gray-600 shadow-lg">
                <i class="fa-solid fa-chevron-left text-xl"></i>
            </button>
            <button onclick="nextCard()" class="w-14 h-14 rounded-full bg-indigo-600 text-white flex justify-center items-center active:bg-indigo-500 hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-chevron-right text-xl"></i>
            </button>
        </div>
    </div>

</div>

<script>
    // 단원별(12, 13, 14강)로 완벽히 분리된 어원 데이터베이스 (총 132단어)
    const db = {
        // ----------------- [ 12강: 48단어 ] -----------------
        12: [
            // 1. 변화와 다양성
            { word: "a variety of", meaning: "다양한", root: "var(다르다) + iety", cognates: "vary(다르다), various(다양한)", group: "변화와 다양성" },
            { word: "variable", meaning: "바뀔 수 있는", root: "var(다르다) + able", cognates: "variety(다양성)", group: "변화와 다양성" },
            { word: "vary", meaning: "바뀌다 다르다", root: "var(다르다)", cognates: "variant(변형)", group: "변화와 다양성" },
            { word: "varied", meaning: "다양한", root: "var(다르다) + ed", cognates: "variation(변화)", group: "변화와 다양성" },
            { word: "extreme", meaning: "극단의", root: "extr(밖의) + eme", cognates: "exterior(외부의)", group: "변화와 다양성" },
            
            // 2. 명확성과 묘사
            { word: "clear", meaning: "명확한", root: "clar(맑은)", cognates: "clarify(명확히 하다)", group: "명확성과 묘사" },
            { word: "unclear", meaning: "애매한, 분명하지 않은", root: "un(부정) + clear", cognates: "clear(명확한)", group: "명확성과 묘사" },
            { word: "dim", meaning: "희미한, 어렴풋한", root: "고대 영어 dimm (어두운)", cognates: "dimly(희미하게)", group: "명확성과 묘사" },
            { word: "obscurity", meaning: "불분명", root: "ob(덮어서) + scur(어두운)", cognates: "obscure(애매한)", group: "명확성과 묘사" },
            { word: "descriptive", meaning: "묘사적인, 설명적인", root: "de(아래로) + scrib(쓰다)", cognates: "describe(묘사하다)", group: "명확성과 묘사" },
            { word: "description", meaning: "묘사", root: "de(아래로) + script(쓰다)", cognates: "describe(묘사하다)", group: "명확성과 묘사" },
            { word: "represent", meaning: "~을 상징하다 나타내다", root: "re(다시) + present", cognates: "representative(대표)", group: "명확성과 묘사" },
            { word: "symbol", meaning: "상징", root: "sym(함께) + bol(던지다)", cognates: "symbolic(상징적인)", group: "명확성과 묘사" },
            { word: "in brief", meaning: "간단히 말해서, 요컨대", root: "brief(짧은)", cognates: "briefly(간단히)", group: "명확성과 묘사" },
            { word: "paradoxical", meaning: "역설적인", root: "para(반대의) + dox(의견)", cognates: "paradox(역설)", group: "명확성과 묘사" },
            { word: "monotone", meaning: "단조로움, 변화가 없음", root: "mono(하나의) + tone(소리)", cognates: "monologue(독백)", group: "명확성과 묘사" },

            { word: "inflexible", meaning: "융통성 없는", root: "in(부정) + flex(구부리다)", cognates: "flexible(유연한)", group: "형태와 크기" },
            { word: "flat (tire)", meaning: "바람 빠진 타이어", root: "flat(평평한)", cognates: "flatten(평평하게 하다)", group: "형태와 크기" },

            { word: "level", meaning: "편평한", root: "libra(저울, 수평)", cognates: "libra(천칭자리)", group: "형태와 크기" },

            { word: "deep", meaning: "깊은", root: "고대 영어 deop (깊은)", cognates: "depth(깊이)", group: "형태와 크기" },

            // 4. 상태와 성질

            { word: "keen", meaning: "날카로운", root: "고대 영어 cene", cognates: "keenly(예리하게)", group: "상태와 성질" },
            { word: "dull", meaning: "무딘", root: "고대 영어 dol (둔한)", cognates: "dullness(둔함)", group: "상태와 성질" },
            { word: "wonder", meaning: "놀라다, 감탄하다", root: "wundor (놀라움)", cognates: "wonderful(놀라운)", group: "상태와 성질" },
            { word: "marvelous", meaning: "놀라운, 멋진", root: "mir(놀라다) → marvel", cognates: "miracle(기적)", group: "상태와 성질" },
            { word: "natural", meaning: "자연적인", root: "nat(태어나다) + ural", cognates: "nature(자연)", group: "상태와 성질" },
            { word: "boring", meaning: "단조로운, 변화 없는, 지루한", root: "bore(파고들다 → 지루하게 하다)", cognates: "boredom(지루함)", group: "상태와 성질" },
            { word: "authentic", meaning: "진짜의", root: "auto(스스로) + hent(행하는)", cognates: "author(작가)", group: "상태와 성질" },
            
            // 5. 평가와 필수 (기타)
            { word: "moderation", meaning: "알맞음, 중용", root: "mod(척도, 조절) + eration", cognates: "moderate(적당한)", group: "평가와 필수" },
            { word: "moderator", meaning: "중재자", root: "mod(기준) + erator", cognates: "modify(수정하다)", group: "평가와 필수" },
            { word: "proper", meaning: "적당한, 알맞은", root: "propri(자신의, 알맞은)", cognates: "property(재산)", group: "평가와 필수" },

            { word: "necessary", meaning: "필수적인", root: "ne(아닌) + cess(물러나다)", cognates: "access(접근)", group: "가격과 가치" },

            // 3. 품질과 보증
            { word: "quality", meaning: "질", root: "qual(성질) + ity", cognates: "qualify(자격을 주다)", group: "품질과 보증" },
            { word: "quality time", meaning: "양질의 시간", root: "quality + time", cognates: "quality(질)", group: "품질과 보증" },
            { word: "qualify", meaning: "~에게 자격을 주다", root: "qual(성질) + fy(만들다)", cognates: "qualification(자격)", group: "품질과 보증" },
            { word: "ensure", meaning: "보증하다", root: "en(만들다) + sure(확실한)", cognates: "assure(장담하다)", group: "품질과 보증" },
            { word: "warranty", meaning: "보증(서)", root: "war(지켜보다, 보호하다)", cognates: "guard(경호원)", group: "품질과 보증" },
            { word: "money-back guarantee", meaning: "환불 보증", root: "guarantee(보증)", cognates: "guarantor(보증인)", group: "품질과 보증" },
            { word: "satisfactory", meaning: "만족스러운", root: "sat(충분한) + isfactory", cognates: "satisfy(만족시키다)", group: "품질과 보증" },
            { word: "satisfaction", meaning: "만족", root: "sat(충분한) + isfaction", cognates: "saturate(흠뻑 적시다)", group: "품질과 보증" },
            { word: "dissatisfy", meaning: "불만을 느끼게 하다", root: "dis(부정) + sat(충분한)", cognates: "satisfy(만족시키다)", group: "품질과 보증" },

            // 4. 수량과 포함
            { word: "include", meaning: "포함하다", root: "in(안에) + clud(가두다)", cognates: "conclude(결론짓다)", group: "수량과 포함" },
            { word: "exclude, omit", meaning: "~을 빠뜨리다, 생략하다", root: "ex(밖으로)+clud / ob(멀리)+mit", cognates: "emit(방출하다)", group: "수량과 포함" },
            { word: "part", meaning: "일부", root: "part(나누다, 부분)", cognates: "particle(입자)", group: "수량과 포함" },
            { word: "partial", meaning: "일부의", root: "part(부분) + ial", cognates: "partially(부분적으로)", group: "수량과 포함" },
            { word: "amount", meaning: "양", root: "ad(~에) + mount(오르다)", cognates: "mountain(산)", group: "수량과 포함" },
            { word: "sum", meaning: "합계, 전체", root: "summa(최고, 꼭대기)", cognates: "summary(요약)", group: "수량과 포함" },
            { word: "reduction", meaning: "축소, 삭감", root: "re(뒤로) + duc(이끌다)", cognates: "reduce(줄이다)", group: "수량과 포함" },
            { word: "insertion", meaning: "주입, 삽입", root: "in(안에) + sert(넣다)", cognates: "insert(삽입하다)", group: "수량과 포함" },
            { word: "quantity", meaning: "양", root: "quant(얼마나) + ity", cognates: "quantify(양을 재다)", group: "수량과 포함" },
            { word: "quantify", meaning: "양을 측정하다", root: "quant(얼마나) + fy(만들다)", cognates: "quantity(수량)", group: "수량과 포함" },
            { word: "unsteady", meaning: "불안정한", root: "un(부정) + stead(서 있는)", cognates: "steady(꾸준한)", group: "수량과 포함" },

            // 5. 특성과 유행
            { word: "characteristic", meaning: "특성", root: "character(새겨진 자국) + istic", cognates: "character(특징)", group: "특성과 유행" },
            { word: "label", meaning: "꼬리표", root: "라틴어 labellum(헝겊 조각)", cognates: "lapel(옷깃)", group: "특성과 유행" },
            { word: "tag", meaning: "꼬리표, 상표", root: "tag(끝에 붙은 것)", cognates: "tack(압정)", group: "특성과 유행" },
            { word: "tendency", meaning: "경향, 흐름", root: "tend(뻗다, 향하다) + ency", cognates: "extend(연장하다)", group: "특성과 유행" },
            { word: "trendy", meaning: "최신 유행의", root: "trend(방향, 흐름) + y", cognates: "trend(추세)", group: "특성과 유행" },
            { word: "fashion, vogue", meaning: "유행", root: "fac(만들다), vag(떠돌다)", cognates: "factory(공장)", group: "특성과 유행" },
            { word: "unwrap", meaning: "포장을 풀다", root: "un(반대) + wrap(싸다)", cognates: "wrap(포장하다)", group: "특성과 유행" }
        ],

        // ----------------- [ 14강: 34단어 ] -----------------
        14: [
            // 1. 경쟁과 경기
            { word: "competition", meaning: "경쟁, 대회", root: "com(함께) + pet(구하다) + ition", cognates: "compete(경쟁하다)", group: "경쟁과 경기" },
            { word: "game, competition", meaning: "경기", root: "com(함께) + pet(구하다)", cognates: "petition(청원)", group: "경쟁과 경기" },
            { word: "competitive", meaning: "경쟁적인", root: "com(함께) + pet(구하다) + itive", cognates: "competitor(경쟁자)", group: "경쟁과 경기" },
            { word: "competitor, opponent", meaning: "경쟁자, 경쟁 상대", root: "com+pet / ob(반대로) + pon(놓다)", cognates: "postpone(연기하다)", group: "경쟁과 경기" },
            { word: "rival, competitor", meaning: "적수, 반대자", root: "riv(강을 공유하는 자)", cognates: "river(강)", group: "경쟁과 경기" },
            { word: "oppose", meaning: "반대하다", root: "ob(반대로) + pos(두다)", cognates: "opposite(반대의)", group: "경쟁과 경기" },
            { word: "tourney", meaning: "토너먼트에 참가하다", root: "torn(돌다) → 빙빙 돌며 겨루다", cognates: "turn(돌다)", group: "경쟁과 경기" },
            { word: "championship", meaning: "선수권; (pl.) 선수권 대회", root: "champ(투사) + ship", cognates: "champion(챔피언)", group: "경쟁과 경기" },
            { word: "champ, winner", meaning: "챔피언, 우승자", root: "champ / win", cognates: "champion", group: "경쟁과 경기" },
            { word: "ranking", meaning: "순위", root: "rank(줄, 열)", cognates: "rank(계급)", group: "경쟁과 경기" },
            { word: "be held", meaning: "개최되다, 열리다", root: "hold(열다, 잡다)의 수동태", cognates: "hold(잡다)", group: "경쟁과 경기" },

            // 2. 참여와 스포츠
            { word: "athlete", meaning: "운동선수", root: "athl(상, 경기) + ete", cognates: "athletic(운동의)", group: "참여와 스포츠" },
            { word: "extreme sports", meaning: "극한 스포츠", root: "extr(밖의) + sports", cognates: "extreme(극한)", group: "참여와 스포츠" },
            { word: "indoor", meaning: "실내의, 집 안의", root: "in(안에) + door(문)", cognates: "outdoor(야외의)", group: "참여와 스포츠" },
            { word: "take part in", meaning: "참여하다, 참가하다", root: "part(부분)를 취하다", cognates: "participate(참여하다)", group: "참여와 스포츠" },
            { word: "participation", meaning: "참가", root: "part(부분) + cip(잡다)", cognates: "capture(포획하다)", group: "참여와 스포츠" },
            { word: "amateurish", meaning: "미숙한", root: "amat(사랑하다) + eurish", cognates: "amateur(아마추어)", group: "참여와 스포츠" },
            { word: "professional", meaning: "전문가의", root: "pro(앞에서) + fess(말하다)", cognates: "profess(공언하다)", group: "참여와 스포츠" },

            // 3. 규칙과 공정성
            { word: "fair play", meaning: "정정당당한 경기 태도", root: "fair(공평한) + play", cognates: "fairness(공평함)", group: "규칙과 공정성" },
            { word: "fairness", meaning: "공평함", root: "fair(공평한) + ness", cognates: "fairly(공정하게)", group: "규칙과 공정성" },
            { word: "unfair", meaning: "불공평한", root: "un(부정) + fair(공평한)", cognates: "fair(공평한)", group: "규칙과 공정성" },
            { word: "foully", meaning: "부정하게", root: "foul(반칙, 더러운) + ly", cognates: "foul(반칙)", group: "규칙과 공정성" },
            { word: "penal", meaning: "처벌의, 형벌의", root: "poen(벌) + al(형용사)", cognates: "penalty(형벌)", group: "규칙과 공정성" },
            { word: "cancel", meaning: "~을 취소하다, 철회하다", root: "cancelli(격자 무늬) → 엑스표 쳐서 지우다", cognates: "cancellation(취소)", group: "규칙과 공정성" },

            // 4. 감정과 행동 (기타)
            { word: "clap", meaning: "박수 치다", root: "의성어", cognates: "clapper(박수치는 사람)", group: "감정과 행동" },
            { word: "applause", meaning: "박수갈채", root: "ad(~를 향해) + plaud(손뼉치다)", cognates: "explode(폭발하다)", group: "감정과 행동" },
            { word: "encouragement", meaning: "격려", root: "en(주다) + cour(용기) + agement", cognates: "courage(용기)", group: "감정과 행동" },
            { word: "discourage", meaning: "낙담시키다", root: "dis(빼앗다) + cour(용기)", cognates: "encourage(격려하다)", group: "감정과 행동" },
            { word: "outstand", meaning: "눈에 띄다", root: "out(밖으로) + stand(서다)", cognates: "outstanding(뛰어난)", group: "감정과 행동" },
            { word: "hobby", meaning: "취미, 오락", root: "작은 말(hobbyhorse)에서 유래", cognates: "-", group: "감정과 행동" },
            { word: "service", meaning: "봉사, 서비스", root: "serv(노예, 섬기다)", cognates: "servant(하인)", group: "감정과 행동" },
            { word: "able", meaning: "할 수 있는", root: "라틴어 habilis(다루기 쉬운)", cognates: "ability(능력)", group: "감정과 행동" },
            { word: "slide", meaning: "미끄러짐", root: "고대영어 slidan", cognates: "sled(썰매)", group: "감정과 행동" },
            { word: "extremely", meaning: "극도로, 매우", root: "extr(끝) + emely", cognates: "extreme(극한의)", group: "감정과 행동" }
        ]
    };

    let currentLesson = 12; // 기본 선택 단원
    let currentCardIndex = 0;
    let isFlipped = false;
    let currentFlatWordList = [];

    // --- 단원(탭) 변경 로직 ---
    function setLesson(lessonNumber) {
        currentLesson = lessonNumber;
        currentCardIndex = 0; // 카드 인덱스 초기화

        // 탭 UI 업데이트
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.classList.replace('text-indigo-600', 'text-gray-500');
            btn.classList.replace('border-indigo-600', 'border-transparent');
            btn.classList.remove('bg-indigo-50');
        });
        const activeTab = document.getElementById(`tab-${lessonNumber}`);
        activeTab.classList.add('active');
        activeTab.classList.replace('text-gray-500', 'text-indigo-600');
        activeTab.classList.replace('border-transparent', 'border-indigo-600');
        activeTab.classList.add('bg-indigo-50');

        renderList();
    }

    // --- 초기화 및 리스트 렌더링 ---
    function renderList() {
        const listView = document.getElementById('listView');
        let htmlContent = '';
        
        // 현재 단원의 데이터를 가져와 화면 출력용 리스트 만들기
        const words = db[currentLesson];
        currentFlatWordList = words; // 플래시카드용 배열 업데이트

        // 그룹별로 나누기
        const groupedData = words.reduce((acc, word) => {
            if (!acc[word.group]) acc[word.group] = [];
            acc[word.group].push(word);
            return acc;
        }, {});

        // 🎯 고유 ID 생성을 위한 전역 카운터 추가 (버그 수정)
        let wordCounter = 0; 

        for (const [groupName, groupWords] of Object.entries(groupedData)) {
            htmlContent += `
                <div class="mb-6">
                    <h2 class="text-sm font-bold text-indigo-600 uppercase tracking-wider mb-3 px-1"><i class="fa-solid fa-folder-tree mr-2"></i>${groupName}</h2>
                    <div class="space-y-3">
            `;
            
            groupWords.forEach((item) => {
                // 🎯 배열 내부 인덱스 대신, 전체 카운터를 사용해 절대 중복되지 않는 ID 생성
                const id = `word-${currentLesson}-${wordCounter++}`;
                htmlContent += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition" onclick="toggleAccordion('${id}')">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">${item.word}</h3>
                                <p class="text-sm text-gray-500 mt-1">${item.meaning}</p>
                            </div>
                            <div class="text-indigo-400">
                                <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300"></i>
                            </div>
                        </div>
                        
                        <div id="content-${id}" class="accordion-content bg-gray-50 px-4 border-t border-gray-100">
                            <div class="mb-3">
                                <span class="inline-block bg-indigo-100 text-indigo-700 text-xs px-2 py-1 rounded font-bold mb-1">어원 분석</span>
                                <p class="text-sm text-gray-700 leading-relaxed">${item.root}</p>
                            </div>
                            <div class="pb-2">
                                <span class="inline-block bg-emerald-100 text-emerald-700 text-xs px-2 py-1 rounded font-bold mb-1">동계어 (Family)</span>
                                <p class="text-sm text-gray-700 font-medium">${item.cognates}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div></div>`;
        }
        listView.innerHTML = htmlContent;
        updateFlashcard();
    }

    // --- 아코디언 토글 로직 ---
    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            icon.classList.remove('rotate-180');
        } else {
            content.classList.add('open');
            icon.classList.add('rotate-180');
        }
    }

    // --- 플래시카드 토글 모드 ---
    function toggleMode() {
        const listView = document.getElementById('listView');
        const flashcardView = document.getElementById('flashcardView');
        const modeBtn = document.getElementById('modeToggleBtn');
        
        if (flashcardView.classList.contains('hidden')) {
            // Show Flashcards
            flashcardView.classList.remove('hidden');
            flashcardView.classList.add('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
            updateFlashcard();
        } else {
            // Show List
            flashcardView.classList.add('hidden');
            flashcardView.classList.remove('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
        }
    }

    // --- 플래시카드 업데이트 및 네비게이션 ---
    function updateFlashcard() {
        const item = currentFlatWordList[currentCardIndex];
        document.getElementById('cardGroup').innerText = `${currentLesson}강 - ${item.group}`;
        document.getElementById('cardWord').innerText = item.word;
        document.getElementById('cardWordBack').innerText = item.word;
        document.getElementById('cardMeaning').innerText = item.meaning;
        document.getElementById('cardRoot').innerText = item.root;
        document.getElementById('cardCognates').innerText = item.cognates;
        
        document.getElementById('flashcardCounter').innerText = `${currentLesson}강: ${currentCardIndex + 1} / ${currentFlatWordList.length}`;
        
        // 카드 넘길 때 항상 앞면으로 리셋
        if(isFlipped) {
            document.getElementById('flashcard').classList.remove('rotate-y-180');
            isFlipped = false;
        }
    }

    function flipCard() {
        const card = document.getElementById('flashcard');
        isFlipped = !isFlipped;
        if (isFlipped) {
            card.classList.add('rotate-y-180');
        } else {
            card.classList.remove('rotate-y-180');
        }
    }

    function prevCard() {
        if (currentCardIndex > 0) {
            currentCardIndex--;
            updateFlashcard();
        } else {
            // 처음이면 마지막으로 루프
            currentCardIndex = currentFlatWordList.length - 1;
            updateFlashcard();
        }
    }

    function nextCard() {
        if (currentCardIndex < currentFlatWordList.length - 1) {
            currentCardIndex++;
            updateFlashcard();
        } else {
            // 마지막이면 처음으로 루프
            currentCardIndex = 0;
            updateFlashcard();
        }
    }

    // 앱 실행
    window.onload = () => {
        setLesson(12); // 처음 접속 시 12강 기본 선택
    };
</script>
</body>
</html>
