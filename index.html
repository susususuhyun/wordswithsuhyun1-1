<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>워마 고등베이직 메타인지 단어장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 기본 폰트 및 앱 스타일 스크롤바 숨김 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; overflow-x: hidden; color: #f8fafc; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 부드러운 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; background-color: #1e293b; }
        .accordion-content.open { max-height: 350px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 카드 뒤집기 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 모바일 앱 컨테이너 제어 */
        .app-container { max-width: 480px; margin: 0 auto; background-color: #0f172a; min-height: 100vh; position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        
        /* 커스텀 버튼 (햄버거 메뉴용) */
        .menu-btn { background: none; border: none; color: #cbd5e1; font-size: 1.5rem; cursor: pointer; padding: 0.5rem; }
        .menu-btn:hover { color: #f8fafc; }

        /* 사이드바 스타일 */
        .sidebar { position: absolute; top: 0; left: -100%; width: 75%; height: 100%; background-color: #1e293b; z-index: 50; transition: left 0.3s ease; box-shadow: 5px 0 15px rgba(0,0,0,0.5); overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 40; display: none; }
        .sidebar-overlay.open { display: block; }
        
        .lesson-tab { padding: 1rem 1.5rem; color: #94a3b8; border-bottom: 1px solid #334155; display: block; width: 100%; text-align: left; transition: all 0.2s; }
        .lesson-tab:hover { background-color: #334155; color: #f8fafc; }
        .lesson-tab.active { background-color: #3b82f6; color: white; font-weight: bold; border-left: 4px solid #60a5fa; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleMenu()"></div>

    <!-- Sidebar Menu -->
    <nav id="sidebar" class="sidebar">
        <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800">
            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-book-open mr-2 text-blue-400"></i>학습 단원 선택</h2>
            <button onclick="toggleMenu()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="menuContainer" class="py-2">
            <!-- 자바스크립트로 메뉴 렌더링 -->
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-slate-800 p-4 sticky top-0 z-20 flex justify-between items-center shadow-lg border-b border-slate-700">
        <div class="flex items-center">
            <button class="menu-btn mr-3" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight" id="headerTitle">단원을 선택하세요</h1>
                <p class="text-xs text-blue-400 mt-0.5 font-medium">메타인지 어원 학습</p>
            </div>
        </div>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-blue-600 bg-opacity-20 text-blue-400 border border-blue-500 px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm hover:bg-blue-600 hover:text-white transition">
            <i class="fa-solid fa-clone mr-1"></i> 카드모드
        </button>
    </header>

    <!-- Main Content Area (List Mode) -->
    <main id="listView" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 bg-slate-900">
        <!-- 콘텐츠는 JavaScript로 렌더링됩니다 -->
    </main>

    <!-- Flashcard Mode (Hidden by default) -->
    <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900 z-30 flex-col pb-10 pt-16">
        <!-- 헤더 -->
        <div class="flex justify-between items-center p-5 text-white">
            <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 text-blue-400 shadow-inner">0 / 0</span>
            <button onclick="toggleMode()" class="text-slate-400 hover:text-white transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
        </div>

        <!-- 카드 영역 -->
        <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
            <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                
                <!-- 앞면 (단어) -->
                <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] backface-hidden flex flex-col justify-center items-center p-8 text-center border-b-8 border-blue-500">
                    <span id="cardGroup" class="absolute top-6 text-xs font-bold text-blue-400 bg-slate-900 px-3 py-1 rounded-full border border-slate-700">그룹</span>
                    <h2 id="cardWord" class="text-4xl font-black text-white mb-4 tracking-tight break-words">Word</h2>
                    <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-hand-pointer mr-2"></i>탭하여 뜻/어원 확인</p>
                </div>

                <!-- 뒷면 (뜻, 어원, 동계어) -->
                <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-2xl backface-hidden rotate-y-180 flex flex-col p-6 text-white overflow-y-auto border border-slate-600">
                    <h2 id="cardWordBack" class="text-2xl font-bold mb-3 border-b border-slate-600 pb-2 text-blue-400">Word</h2>
                    <p id="cardMeaning" class="text-xl font-black mb-5 text-white">의미</p>
                    
                    <div class="bg-slate-900 rounded-xl p-4 shadow-inner mb-3 border border-slate-700">
                        <p class="text-[0.7rem] text-blue-400 mb-1.5 font-bold uppercase tracking-wider"><i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원 스토리</p>
                        <p id="cardRoot" class="text-[0.85rem] leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                    </div>
                    
                    <div class="bg-slate-900 rounded-xl p-4 shadow-inner border border-slate-700">
                        <p class="text-[0.7rem] text-teal-400 mb-1.5 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 패밀리 단어 (Cognates)</p>
                        <p id="cardCognates" class="text-[0.85rem] font-medium text-slate-400">동계어 설명</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 네비게이션 컨트롤 -->
        <div class="flex justify-center items-center space-x-8 px-6 pb-4">
            <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-700 text-white flex justify-center items-center active:bg-slate-600 hover:bg-slate-600 transition border border-slate-600 shadow-lg">
                <i class="fa-solid fa-chevron-left text-2xl"></i>
            </button>
            <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-blue-600 text-white flex justify-center items-center active:bg-blue-500 hover:bg-blue-500 transition shadow-[0_0_20px_rgba(59,130,246,0.4)] font-bold border border-blue-500">
                <i class="fa-solid fa-chevron-right text-2xl"></i>
            </button>
        </div>
    </div>

</div>

<script>
    // --- 통합 데이터베이스 (워마 고등 베이직 1강~8강, 총 378단어) ---
    // 구조: { "강 이름": [ { word, meaning, root, cognates, group }, ... ] }
    const database = {
        "1강 (40단어)": [
            { word: "quantity", meaning: "양, 수량", root: "quantus(얼마나 많은) + -ity(명사) → 셀 수 있거나 잴 수 있는 크기나 덩어리", cognates: "quantify(양을 재다), quantum(양자)", group: "수치와 측정" },
            { word: "aim", meaning: "목표, 목적, 목표로 하다, 겨냥하다", root: "aesmer(평가하다) → 화살을 쏘기 전 거리와 방향을 가늠하고 정하는 행위", cognates: "estimate(평가하다)", group: "의지와 행동" },
            { word: "reject", meaning: "거절하다, 거부하다", root: "re(뒤로) + ject(던지다) → 상대가 준 제안이나 물건을 받지 않고 뒤로 휙 던져버리다", cognates: "project(투영하다), inject(주사하다)", group: "수용과 거부" },
            { word: "experience", meaning: "경험하다, 경험", root: "ex(밖으로) + per(시도하다) + -ence → 밖으로 나가 직접 부딪혀보고 위험을 감수하며 얻는 것", cognates: "experiment(실험), expert(전문가)", group: "인식과 감각" },
            { word: "practical", meaning: "실용적인, 실제적인", root: "pract(행동하다) + -ical → 머릿속 이론이 아니라 실제로 행동하여 써먹을 수 있는", cognates: "practice(연습, 실행), pragmatic(실용적인)", group: "상태와 특성" },
            { word: "include", meaning: "포함하다", root: "in(안에) + clud(닫다) → 테두리 안으로 밀어 넣고 문을 닫아 내 것으로 만들다", cognates: "exclude(제외하다), conclude(결론짓다)", group: "수치와 측정" },
            { word: "carry out", meaning: "~을 실행[수행]하다, ~을 완료하다", root: "carry(나르다) + out(밖으로) → 마음속 계획을 현실 밖으로 가져와 끝까지 해내다", cognates: "-", group: "의지와 행동" },
            { word: "grief", meaning: "(깊은) 슬픔, 비탄", root: "gravis(무거운) → 마음속에 돌덩이가 얹힌 것처럼 무겁고 숨막히는 감정", cognates: "grave(무덤, 중대한), gravity(중력)", group: "감정과 심리" },
            { word: "supply", meaning: "공급하다, 제공하다, 공급", root: "sup(아래서부터) + ply(채우다) → 모자란 부분을 밑바닥부터 위까지 꽉꽉 채워주다", cognates: "complete(완전한), plenty(풍부함)", group: "행위와 과정" },
            { word: "improve", meaning: "개선하다, 향상하다", root: "in(안으로) + prove(이익) → 상태나 가치를 이익이 나고 돈이 되는 쪽으로 더 좋게 만들다", cognates: "profit(이익), proof(증명)", group: "행위와 과정" },
            { word: "failure", meaning: "실패, 실패작, 고장", root: "fail(실패하다) + -ure(명사) → 목표에 닿지 못하고 도중에 쓰러진 상태", cognates: "fail(실패하다)", group: "상태와 특성" },
            { word: "provide", meaning: "공급하다, 제공하다, 대비하다", root: "pro(앞을) + vid(보다) → 앞날에 무슨 일이 생길지 미리 내다보고 필요한 걸 준비해 두다", cognates: "video(비디오), vision(시야)", group: "행위와 과정" },
            { word: "emerge", meaning: "나타나다, 모습을 드러내다, (생각·사실 등이) 드러나다", root: "e(밖으로) + merg(잠기다/뜨다) → 물속 깊이 잠겨 안 보이던 것이 밖으로 쑥 떠오르다", cognates: "emergency(비상사태), merge(합병하다)", group: "인식과 감각" },
            { word: "share", meaning: "나누다, 공유하다, 몫", root: "scearu(자르다) → 하나의 큰 덩어리를 여러 조각으로 잘라서 각자 나눠 갖는 것", cognates: "shear(털을 깎다)", group: "행위와 과정" },
            { word: "increase", meaning: "증가하다, 증가시키다, 증가, 인상", root: "in(안에) + creas(자라다) → 씨앗이 땅 안에서 쑥쑥 자라나 부피나 수량이 점점 커짐", cognates: "create(창조하다), decrease(감소하다)", group: "수치와 측정" },
            { word: "run into", meaning: "~와 우연히 만나다, ~와 충돌하다", root: "run(달리다) + into(~안으로) → 정신없이 달리다가 예상치 못한 사람이나 상황 안으로 쾅 부딪힘", cognates: "-", group: "인식과 감각" },
            { word: "inferior", meaning: "열등한, 하위의, 손아랫사람, 하급자", root: "infer(아래의) + -ior(더 ~한) → 남들보다 등수나 가치, 지위가 더 아래쪽에 있는", cognates: "inferno(지옥), superior(우수한)", group: "상태와 특성" },
            { word: "emotion", meaning: "감정, 정서", root: "e(밖으로) + mot(움직이다) + -ion → 마음속에만 있던 느낌이 얼굴 표정이나 행동으로 밖으로 튀어나옴", cognates: "motion(움직임), motivate(동기를 주다)", group: "감정과 심리" },
            { word: "recover", meaning: "회복하다, 복구되다", root: "re(다시) + cover(덮다/얻다) → 잃어버렸던 건강, 재산, 상태를 다시 덮어 내 것으로 만들다", cognates: "cover(덮다), discover(발견하다)", group: "행위와 과정" },
            { word: "refuse", meaning: "거절하다, 거부하다", root: "re(뒤로) + fus(붓다) → 상대가 주는 제안을 안 받겠다고 내 등 뒤로 확 쏟아버리다", cognates: "confuse(혼란시키다), fuse(녹이다)", group: "수용과 거부" },
            { word: "moment", meaning: "순간, 중요성", root: "movimentum(움직임) → 저울추가 까닥 하고 아주 짧게 한 번 움직이는 찰나의 시간", cognates: "move(움직이다), momentum(탄력)", group: "상태와 특성" },
            { word: "common", meaning: "흔한, 보통의, 공통의", root: "com(함께) + mun(의무, 나누다) → 특별한 사람만 갖는 게 아니라 누구나 널리 함께 나눠 갖는", cognates: "community(공동체), immune(면역의)", group: "상태와 특성" },
            { word: "success", meaning: "성공, 성공작", root: "sub(아래서부터) + cess(가다) → 가장 밑바닥에서 시작해 마침내 원하는 목표 지점까지 꾹 참고 가다", cognates: "proceed(진행하다), access(접근)", group: "상태와 특성" },
            { word: "certain", meaning: "확실한, 확신하는, 어떤", root: "cert(결정된) + -ain → 더 이상 바꿀 수 없게 도장이 쾅 찍혀 딱 정해진", cognates: "certificate(증명서)", group: "상태와 특성" },
            { word: "advanced", meaning: "진보한, 상급의", root: "ad(~로) + vant(앞으로) + -ed → 남들보다 한 발 더 앞쪽으로 쑥 나아가 있는", cognates: "advance(전진하다), advantage(유리함)", group: "상태와 특성" },
            { word: "slight", meaning: "약간의, 하찮은", root: "sliht(평평한, 매끄러운) → 너무 얇고 매끄러워서 무게감이나 중요성이 거의 없는", cognates: "slice(얇게 썰다)", group: "수치와 측정" },
            { word: "consider", meaning: "고려[숙고]하다, ~으로 여기다", root: "con(함께) + sider(별) → 옛날 사람들이 중대한 결정을 내릴 때 밤하늘의 별자리를 함께 보며 점치던 행동", cognates: "desire(바라다 - 별에게 소원을 빌다)", group: "인식과 감각" },
            { word: "belief", meaning: "믿음, 신념, 신앙", root: "be(강조) + lief(사랑하다) → 어떤 것이 진짜라고 마음 깊이 맹세하고 사랑하며 따르는 마음", cognates: "believe(믿다)", group: "감정과 심리" },
            { word: "express", meaning: "표현하다, 나타내다, 속달로 보내다, 급행의, 신속한, 급행, 속달", root: "ex(밖으로) + press(누르다) → 머릿속 생각을 밖으로 꾹 짜내 보여주다 (또는 쫙 짜내듯 빨리 가다)", cognates: "press(누르다), pressure(압력)", group: "의지와 행동" },
            { word: "accept", meaning: "받아들이다, 수락하다", root: "ad(~쪽으로) + cept(잡다) → 누군가 주는 것을 내 쪽으로 기꺼이 끌어당겨 손에 쥐다", cognates: "except(제외하다), capture(포획하다)", group: "수용과 거부" },
            { word: "decrease", meaning: "감소하다, 감소시키다, 감소, 축소", root: "de(아래로) + creas(자라다) → 위로 커지지 않고 반대로 아래로 점점 쪼그라들다", cognates: "increase(증가하다), create(창조하다)", group: "수치와 측정" },
            { word: "situation", meaning: "상황, 위치", root: "situ(장소) + -ation → 사람이나 사물이 특정한 시점과 장소에 놓여 있는 꼴", cognates: "site(현장), situate(위치시키다)", group: "상태와 특성" },

    let currentLesson = "1강 (40단어)"; 
    let currentCardIndex = 0;
    let isFlipped = false;
    let currentFlatWordList = [];

    // --- 사이드바 메뉴 렌더링 ---
    function renderMenu() {
        const menuContainer = document.getElementById('menuContainer');
        menuContainer.innerHTML = '';
        
        for (const lesson in database) {
            const btn = document.createElement('button');
            btn.className = `lesson-tab ${lesson === currentLesson ? 'active' : ''}`;
            btn.innerHTML = `<i class="fa-solid fa-bookmark mr-2"></i>${lesson}`;
            btn.onclick = () => loadLesson(lesson);
            menuContainer.appendChild(btn);
        }
    }

    // --- 단원 불러오기 로직 ---
    function loadLesson(lessonName) {
        currentLesson = lessonName;
        currentCardIndex = 0;
        document.getElementById('headerTitle').innerText = lessonName;
        toggleMenu(true); // 메뉴 강제 닫기
        renderMenu(); // 메뉴 액티브 상태 업데이트
        renderList();
    }

    // --- 사이드바 토글 ---
    function toggleMenu(forceClose = false) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        if (forceClose || sidebar.classList.contains('open')) {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        } else {
            sidebar.classList.add('open');
            overlay.classList.add('open');
        }
    }

    // --- 리스트 렌더링 ---
    function renderList() {
        const listView = document.getElementById('listView');
        let htmlContent = '';
        
        const words = database[currentLesson];
        currentFlatWordList = words; 

        // 그룹별로 데이터 나누기
        const groupedData = words.reduce((acc, word) => {
            if (!acc[word.group]) acc[word.group] = [];
            acc[word.group].push(word);
            return acc;
        }, {});

        for (const [groupName, groupWords] of Object.entries(groupedData)) {
            htmlContent += `
                <div class="mb-6">
                    <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider mb-3 px-1 border-l-4 border-blue-500 pl-2">
                        <i class="fa-solid fa-layer-group mr-2"></i>${groupName}
                    </h2>
                    <div class="space-y-3">
            `;
            
            groupWords.forEach((item, index) => {
                const id = `word-${currentLesson.replace(/\s+/g, '')}-${index}`;
                htmlContent += `
                    <div class="bg-slate-800 rounded-xl shadow-md border border-slate-700 overflow-hidden transform transition hover:-translate-y-0.5 hover:shadow-xl">
                        <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-700 transition" onclick="toggleAccordion('${id}')">
                            <div>
                                <h3 class="text-lg font-bold text-white tracking-wide">${item.word}</h3>
                                <p class="text-[0.9rem] text-slate-400 mt-1">${item.meaning}</p>
                            </div>
                            <div class="text-blue-500 bg-slate-900 w-8 h-8 flex items-center justify-center rounded-full border border-slate-700 shadow-inner">
                                <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-sm"></i>
                            </div>
                        </div>
                        
                        <div id="content-${id}" class="accordion-content px-4 border-t border-slate-700">
                            <div class="mb-4 pt-2">
                                <span class="inline-block bg-blue-900 text-blue-300 text-xs px-2 py-1 rounded font-bold mb-2 border border-blue-800">
                                    <i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원
                                </span>
                                <p class="text-sm text-slate-300 leading-relaxed font-medium break-keep">${item.root}</p>
                            </div>
                            <div class="pb-3">
                                <span class="inline-block bg-slate-700 text-teal-300 text-xs px-2 py-1 rounded font-bold mb-2 border border-slate-600">
                                    <i class="fa-solid fa-link mr-1"></i> 패밀리 단어
                                </span>
                                <p class="text-[0.85rem] text-slate-400 font-medium">${item.cognates}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            htmlContent += `</div></div>`;
        }
        listView.innerHTML = htmlContent;
        updateFlashcard();
    }

    // --- 아코디언 토글 ---
    function toggleAccordion(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);
        
        if (content.classList.contains('open')) {
            content.classList.remove('open');
            icon.classList.remove('rotate-180');
        } else {
            content.classList.add('open');
            icon.classList.add('rotate-180');
        }
    }

    // --- 모드 토글 (리스트 <-> 플래시카드) ---
    function toggleMode() {
        const flashcardView = document.getElementById('flashcardView');
        const modeBtn = document.getElementById('modeToggleBtn');
        
        if (flashcardView.classList.contains('hidden')) {
            flashcardView.classList.remove('hidden');
            flashcardView.classList.add('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
            updateFlashcard();
        } else {
            flashcardView.classList.add('hidden');
            flashcardView.classList.remove('flex');
            modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
        }
    }

    // --- 플래시카드 내용 업데이트 ---
    function updateFlashcard() {
        if(currentFlatWordList.length === 0) return;
        
        const item = currentFlatWordList[currentCardIndex];
        const match = currentLesson.match(/^(\d+)강/);
        const lessonNum = match ? match[1] : '';

        document.getElementById('cardGroup').innerText = `${lessonNum}강 - ${item.group}`;
        document.getElementById('cardWord').innerText = item.word;
        document.getElementById('cardWordBack').innerText = item.word;
        document.getElementById('cardMeaning').innerText = item.meaning;
        document.getElementById('cardRoot').innerText = item.root;
        document.getElementById('cardCognates').innerText = item.cognates;
        
        document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatWordList.length}`;
        
        if(isFlipped) {
            document.getElementById('flashcard').classList.remove('rotate-y-180');
            isFlipped = false;
        }
    }

    function flipCard() {
        const card = document.getElementById('flashcard');
        isFlipped = !isFlipped;
        if (isFlipped) {
            card.classList.add('rotate-y-180');
        } else {
            card.classList.remove('rotate-y-180');
        }
    }

    function prevCard() {
        currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : currentFlatWordList.length - 1;
        updateFlashcard();
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex < currentFlatWordList.length - 1) ? currentCardIndex + 1 : 0;
        updateFlashcard();
    }

    // 초기화
    window.onload = () => {
        renderMenu();
        loadLesson("1강 (40단어)");
    };
</script>
</body>
</html>
