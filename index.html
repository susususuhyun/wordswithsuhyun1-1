<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* App Container to simulate mobile view on desktop */
        #app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* Main Content Area - Scrollable */
        #main-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 2rem;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>

        [28, "emergence", "출현, 발생", "e(밖으로) + merg(빠지다) + ence → 물 밖으로 튀어나옴", "emerge(나타나다)"],
        [28, "condition", "상태, 환경, 상황, 조건, 조항", "con(함께) + dit(주다, 말하다) + ion → 합의하여 말해 둔 것", "dictate(지시하다)"],
        [28, "defend", "방어[수비]하다, 변호하다", "de(떨어져) + fend(치다)", "offend(불쾌하게 하다)"],
        [28, "neural", "신경 (계통)의", "neur(신경) + al", "neurosis(노이로제)"],
        [28, "conscience", "양심", "con(함께) + sci(알다) + ence → 옳고 그름을 스스로 아는 마음", "science(과학)"],
        [28, "conform", "따르다, 순응하다", "con(함께) + form(형태) → 모양을 주변과 똑같이 맞추다", "form(형태)"],
        [28, "stimulate", "자극[격려]하다, 관심을 불러일으키다", "stimul(막대기, 찌르다) + ate", "instinct(본능)"],
        [28, "personal", "개인적인", "person(사람) + al", "person(사람)"],
        [28, "fair", "공평한, 공정한, 상당한, 아름다운, 매력적인, (날씨가) 맑은, 박람회", "아름답고 깨끗한 것에서 출발 → 공명정대한", "-"],
        [28, "be concerned with", "~과 관련되다", "~과 함께 얽혀있다", "concern(관련시키다)"],
        [28, "depend", "의존하다", "de(아래에) + pend(매달리다)", "suspend(매달다)"],
        [28, "confirm", "확인하다", "con(완전히) + firm(단단한)", "firm(단단한)"],
        [28, "revolution", "혁명", "re(다시) + volu(굴리다) + tion → 완전히 뒤집어엎음", "revolve(회전하다)"],
        [28, "calculate", "계산하다", "calc(조약돌) + ulate → 옛날 조약돌로 셈을 하던 것에서 유래", "calcium(칼슘)"],
        [28, "personnel", "인사, 직원", "person(사람) + nel", "person(사람)"],
        [28, "circulate", "순환하다", "circul(원) + ate", "circle(원)"],
        [28, "translate", "번역하다", "trans(가로질러) + lat(나르다) + e", "transfer(옮기다)"],
        [28, "conduct", "전도하다, 지휘하다", "con(함께) + duct(이끌다)", "educate(교육하다)"],
        [28, "terrific", "아주 멋진, 훌륭한", "terr(공포) + ific(만드는) → 두려울 정도로 놀랍고 대단한", "terror(공포)"],
        [28, "simulate", "모의 실험하다", "simul(비슷한) + ate", "similar(비슷한)"],
        [28, "raise", "올리다", "rise의 사역동사 (오르게 하다)", "rise(오르다)"],
        [28, "emergency", "비상사태", "e(밖으로) + merg(빠지다) + ency → 물 밖으로 불쑥 튀어나온 긴급 상황", "emerge(나타나다)"]
    ];

    const words = rawWordData.map(item => ({
        day: item[0],
        en: item[1],
        ko: item[2],
        etymology: item[3],
        cognate: item[4]
    }));

    // State Variables
    let currentView = 'home'; // 'home', 'list'
    let currentDay = 1;
    let currentDayWords = [];

    // DOM Elements
    const mainContent = document.getElementById('main-content');
    const headerTitle = document.getElementById('header-title');
    const btnBack = document.getElementById('btn-back');

    btnBack.addEventListener('click', () => {
        if (currentView === 'list') {
            renderHome();
        }
    });

    function renderHome() {
        currentView = 'home';
        headerTitle.innerText = "스펠링 테스트 단어장";
        btnBack.classList.add('hidden');
        
        let html = `
            <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-4 text-sm text-blue-800 font-medium text-center">
                <i class="fas fa-info-circle mr-1"></i> 전 강좌(1~28강) 스펠링 테스트 모드가 적용되었습니다.
            </div>
            <div class="grid grid-cols-2 gap-4 mt-2">
        `;
        
        for (let i = 1; i <= 28; i++) {
            html += `
                <button onclick="renderList(${i})" class="bg-white border-2 border-blue-400 text-blue-700 rounded-xl p-6 font-extrabold text-lg shadow-sm hover:bg-blue-50 active:scale-95 transition flex flex-col items-center justify-center gap-3">
                    <i class="fas fa-spell-check text-2xl"></i>
                    ${i}강 테스트
                </button>
            `;
        }
        html += `</div>`;
        
        mainContent.innerHTML = html;
    }

    function renderList(day) {
        currentView = 'list';
        currentDay = day;
        currentDayWords = words.filter(w => w.day === day);
        
        headerTitle.innerText = `${day}강 스펠링 테스트`;
        btnBack.classList.remove('hidden');

        let html = `
            <div class="flex flex-col gap-3 pb-8 mt-2">
        `;

        currentDayWords.forEach((word, index) => {
            const hasEtymology = word.etymology && word.etymology.trim() !== "" && word.etymology !== "-";
            html += `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col relative cursor-pointer transition-colors duration-200" onclick="toggleDetails(this)">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-lg font-extrabold text-gray-800 flex-1 break-words pr-2 leading-tight">${word.ko}</span>
                        <span class="text-gray-400 text-xs font-bold whitespace-nowrap bg-gray-100 px-2 py-1 rounded-full">${index + 1} / 40</span>
                    </div>
                    
                    <div class="unrevealed-overlay text-blue-500 font-bold text-sm mt-3 flex items-center gap-2 bg-blue-50 p-3 rounded-lg justify-center border border-blue-100">
                        <i class="fas fa-hand-pointer animate-pulse"></i> <span>터치해서 스펠링 보기</span>
                    </div>

                    <div class="english-word hidden text-3xl font-black text-blue-600 mt-4 text-center tracking-wide">${word.en}</div>
                    
                    ${hasEtymology ? `
                    <div class="details hidden mt-4 pt-4 border-t border-gray-100 text-left">
                        <div class="mb-3">
                            <span class="text-xs font-bold text-blue-700 bg-blue-100 px-2 py-1 rounded">어원</span>
                            <p class="text-sm text-gray-700 mt-2 pl-2 border-l-2 border-blue-300 leading-relaxed">${word.etymology}</p>
                        </div>
                        ${word.cognate && word.cognate !== "-" ? `
                        <div>
                            <span class="text-xs font-bold text-purple-700 bg-purple-100 px-2 py-1 rounded">동계어</span>
                            <p class="text-sm text-gray-700 mt-2 pl-2 border-l-2 border-purple-300 leading-relaxed">${word.cognate}</p>
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}
                </div>
            `;
        });
        
        html += `</div>`;
        mainContent.innerHTML = html;
    }

    window.toggleDetails = function(element) {
        const enWord = element.querySelector('.english-word');
        const details = element.querySelector('.details');
        const overlay = element.querySelector('.unrevealed-overlay');
        
        if (enWord.classList.contains('hidden')) {
            enWord.classList.remove('hidden');
            if(details) details.classList.remove('hidden');
            if(overlay) overlay.classList.add('hidden');
            element.classList.add('bg-blue-50/30');
            element.classList.add('border-blue-200');
        } else {
            enWord.classList.add('hidden');
            if(details) details.classList.add('hidden');
            if(overlay) overlay.classList.remove('hidden');
            element.classList.remove('bg-blue-50/30');
            element.classList.remove('border-blue-200');
        }
    }

    window.onload = () => {
        renderHome();
    };
</script>
</body>
</html>
